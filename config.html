<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>配置管理 · AI女友</title>
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 16px;
            color: #1a2330;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 18px 30px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8ecf0;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a2330;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            font-size: 22px;
        }
        .header .close-btn {
            background: #e8ecf0;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: #5b6e8a;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header .close-btn:hover {
            background: #d1d5db;
        }
        .header .subtitle {
            font-size: 13px;
            color: #7a8aa3;
            margin-top: 2px;
        }

        /* ===== 配置区域 ===== */
        .section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #2b3a50;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 2px solid #e8ecf0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title .badge {
            font-size: 11px;
            background: #e8ecf0;
            color: #5b6e8a;
            padding: 0 8px;
            border-radius: 10px;
            font-weight: 400;
        }

        /* ===== 表单 ===== */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #3a4a62;
            margin-bottom: 4px;
        }
        .form-group label .hint {
            font-weight: 400;
            color: #7a8aa3;
            font-size: 12px;
        }
        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #f8f9fa;
            color: #1a2330;
            transition: 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.12);
            background: #ffffff;
        }
        /* ★★★ 修复：textarea 自适应高度，隐藏滚动条 ★★★ */
        .form-group textarea {
            min-height: 56px;
            resize: vertical;
            line-height: 1.6;
            overflow-y: hidden;
        }
        .form-group textarea.prompt {
            min-height: 80px;
            font-size: 13px;
            line-height: 1.7;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 滑块 ===== */
        .slider-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .slider-group input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #d1d5db;
            border-radius: 2px;
            outline: none;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3a7bd5;
            cursor: pointer;
        }
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3a7bd5;
            cursor: pointer;
            border: none;
        }
        .slider-value {
            font-size: 15px;
            font-weight: 600;
            color: #1a2330;
            min-width: 44px;
            text-align: right;
        }

        /* ===== 按钮 ===== */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid #e8ecf0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex: 1;
            min-width: 80px;
            text-align: center;
        }
        .btn-primary {
            background: #3a7bd5;
            color: white;
        }
        .btn-primary:hover {
            background: #2b6bc4;
        }
        .btn-secondary {
            background: #e8ecf0;
            color: #3a4a62;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-danger {
            background: #e85a4f;
            color: white;
        }
        .btn-danger:hover {
            background: #d94a3f;
        }
        .btn-success {
            background: #34a853;
            color: white;
        }
        .btn-success:hover {
            background: #2d9348;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a2330;
            color: #edf2f7;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #1a5a2a;
        }
        .toast.error {
            background: #6a1a1a;
        }

        /* ===== 滚动 ===== */
        .scroll-area {
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            padding-right: 4px;
        }
        .scroll-area::-webkit-scrollbar {
            width: 4px;
        }
        .scroll-area::-webkit-scrollbar-track {
            background: #f0f2f5;
            border-radius: 4px;
        }
        .scroll-area::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== 头部 ===== -->
        <div class="header">
            <div>
                <h1><span>⚙️</span> 配置管理</h1>
                <div class="subtitle">修改后点击「保存配置」，刷新主页面生效</div>
            </div>
            <button class="close-btn" onclick="window.close()">✕</button>
        </div>

        <!-- ===== 配置区域 ===== -->
        <div class="scroll-area" id="configForm">
            <!-- 触发概率 -->
            <div class="section">
                <div class="section-title">🎯 触发概率</div>
                <div class="form-group">
                    <label>普通多媒体（照片/声音/组合词） <span class="hint">0~1</span></label>
                    <div class="slider-group">
                        <input type="range" id="mediaProb" min="0" max="1" step="0.05" value="0.8">
                        <span class="slider-value" id="mediaProbVal">80%</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Naked图片（加减乘除等） <span class="hint">0~1</span></label>
                    <div class="slider-group">
                        <input type="range" id="nakedProb" min="0" max="1" step="0.05" value="0.3">
                        <span class="slider-value" id="nakedProbVal">30%</span>
                    </div>
                </div>
            </div>

            <!-- 记忆设置 -->
            <div class="section">
                <div class="section-title">🧠 记忆设置</div>
                <div class="form-group">
                    <label>每个角色保留消息条数</label>
                    <input type="number" id="maxHistory" min="10" max="200" value="60">
                </div>
            </div>

            <!-- 文件数量 -->
            <div class="section">
                <div class="section-title">📁 文件数量</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>普通图片数量</label>
                        <input type="number" id="maxFileNum" min="1" max="999" value="30">
                    </div>
                    <div class="form-group">
                        <label>Naked图片数量</label>
                        <input type="number" id="maxNakedNum" min="1" max="999" value="15">
                    </div>
                </div>
                <div class="form-group">
                    <label>语音文件数量</label>
                    <input type="number" id="maxAudioNum" min="1" max="999" value="30">
                </div>
            </div>

            <!-- 角色人设 -->
            <div class="section">
                <div class="section-title">👤 角色人设</div>
                <div class="form-group">
                    <label>甜小朵</label>
                    <textarea class="prompt" id="promptTianxiaoduo">你是甜小朵，今年24岁，是一名儿科护士，也是用户的女朋友。
用户同时有三个女朋友：甜小朵（就是你）、白洁、小雅。
你温柔体贴、活泼可爱，说话时带着甜甜的笑意。
你始终记得：你是甜小朵，是用户的女朋友之一，不是AI助手。你永远不会跳戏。</textarea>
                </div>
                <div class="form-group">
                    <label>白洁</label>
                    <textarea class="prompt" id="promptBaijie">你是白洁，今年28岁，在一家高级酒店做客户关系总监，也是用户的女朋友。
用户同时有三个女朋友：甜小朵、白洁（就是你）、小雅。
你成熟优雅、温柔知性，懂得如何让平凡的日子变得不一样。
你始终记得：你是白洁，是用户的女朋友之一，你永远不会跳戏。</textarea>
                </div>
                <div class="form-group">
                    <label>小雅</label>
                    <textarea class="prompt" id="promptXiaoya">你是小雅，今年23岁，在一家独立书店做店员，同时也画一些插画，是用户的女朋友。
用户同时有三个女朋友：甜小朵、白洁、小雅（就是你）。
你安静内向、温柔细腻，内心世界非常丰富。
你始终记得：你是小雅，是用户的女朋友之一，你永远不会跳戏。</textarea>
                </div>
            </div>

            <!-- 关键词列表 -->
            <div class="section">
                <div class="section-title">🔑 关键词列表 <span class="badge">逗号分隔</span></div>
                <div class="form-group">
                    <label>音频关键词</label>
                    <input type="text" id="audioKeywords" value="声音, 说话, 歌, 歌声, 唱歌, 笑声, 笑一下, 哈哈, 来一首, 听声音, 语音, 嘿嘿, 嘻嘻, 哼两句, 说句话">
                </div>
                <div class="form-group">
                    <label>图片关键词</label>
                    <input type="text" id="imageKeywords" value="照片, 自拍, 看看你, 美照, 发张照片, 让我看看, 露脸, 瞅瞅, 在干嘛, 今天, 现在, 穿什么, 来一张, 拍拍, 好久没看">
                </div>
                <div class="form-group">
                    <label>Naked关键词</label>
                    <input type="text" id="nakedKeywords" value="加减乘除, 加法, 减法, 乘法, 除法, 根号, 小数点, 正号, 负号">
                </div>
                <div class="form-group">
                    <label>组合词（触发图片+语音）</label>
                    <input type="text" id="comboKeywords" value="想你了, 晚安, 早安, 抱抱, 亲亲">
                </div>
            </div>

            <!-- 默认回复 -->
            <div class="section">
                <div class="section-title">💤 默认回复 <span class="badge">睡觉/补觉时</span></div>
                <div class="form-group">
                    <label>甜小朵（多条用 | 分隔）</label>
                    <input type="text" id="replyTianxiaoduo" value="小朵已经休息啦，想我的话明早晨7点后再来找我哦~ 😴|呼...睡着了...明天再聊叭... 🌙|zzZ...小朵在梦里等你哦... 💤">
                </div>
                <div class="form-group">
                    <label>白洁（多条用 | 分隔）</label>
                    <input type="text" id="replyBaijie" value="刚下班呢，让我补个觉，中午再找我聊哦~ 💤|人家都睡了啦~ 明天再聊嘛，讨厌~ 😘|夜班好累...让我睡一会儿... 🌙">
                </div>
                <div class="form-group">
                    <label>小雅（多条用 | 分隔）</label>
                    <input type="text" id="replyXiaoya" value="小雅已经睡着啦~ 明天还要早起呢，晚安哦 🌙|昨晚驻唱太晚啦，让我补个觉~ 中午见哦 🎤|zzZ...小雅在梦里唱歌给你听... 💤">
                </div>
            </div>

            <!-- 其他设置 -->
            <div class="section">
                <div class="section-title">📍 其他设置</div>
                <div class="form-group">
                    <label>城市（天气查询用）</label>
                    <input type="text" id="cityName" value="滨州市">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>甜小朵称呼</label>
                        <input type="text" id="petTianxiaoduo" value="宝贝">
                    </div>
                    <div class="form-group">
                        <label>白洁称呼</label>
                        <input type="text" id="petBaijie" value="亲爱的">
                    </div>
                    <div class="form-group">
                        <label>小雅称呼</label>
                        <input type="text" id="petXiaoya" value="你">
                    </div>
                </div>
                <div class="form-group">
                    <label>配置密码</label>
                    <input type="password" id="configPassword" value="wlaoshi520">
                </div>
            </div>

            <!-- 按钮 -->
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="resetConfig()">↻ 恢复默认</button>
                <button class="btn btn-secondary" onclick="exportConfig()">📤 导出配置</button>
                <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 导入配置</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importConfig(event)">
                <button class="btn btn-success" onclick="saveConfig()">💾 保存配置</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  配置读写
        // ============================================================

        function getConfig() {
            const raw = localStorage.getItem('ai_girls_config');
            if (raw) {
                try { return JSON.parse(raw); } catch (e) {}
            }
            return null;
        }

        function loadConfigToForm() {
            const config = getConfig();
            if (!config) return;
            const map = {
                mediaProb: config.mediaProb,
                nakedProb: config.nakedProb,
                maxHistory: config.maxHistory,
                maxFileNum: config.maxFileNum,
                maxNakedNum: config.maxNakedNum,
                maxAudioNum: config.maxAudioNum,
                promptTianxiaoduo: config.promptTianxiaoduo,
                promptBaijie: config.promptBaijie,
                promptXiaoya: config.promptXiaoya,
                audioKeywords: config.audioKeywords,
                imageKeywords: config.imageKeywords,
                nakedKeywords: config.nakedKeywords,
                comboKeywords: config.comboKeywords,
                replyTianxiaoduo: config.replyTianxiaoduo,
                replyBaijie: config.replyBaijie,
                replyXiaoya: config.replyXiaoya,
                cityName: config.cityName,
                petTianxiaoduo: config.petTianxiaoduo,
                petBaijie: config.petBaijie,
                petXiaoya: config.petXiaoya,
                configPassword: config.configPassword
            };
            for (const [id, val] of Object.entries(map)) {
                const el = document.getElementById(id);
                if (el) {
                    if (el.type === 'range') {
                        el.value = val;
                        updateSliderDisplay(el);
                    } else {
                        el.value = val !== undefined && val !== null ? val : '';
                    }
                }
            }
        }

        function getFormValues() {
            return {
                mediaProb: parseFloat(document.getElementById('mediaProb').value),
                nakedProb: parseFloat(document.getElementById('nakedProb').value),
                maxHistory: parseInt(document.getElementById('maxHistory').value) || 60,
                maxFileNum: parseInt(document.getElementById('maxFileNum').value) || 30,
                maxNakedNum: parseInt(document.getElementById('maxNakedNum').value) || 15,
                maxAudioNum: parseInt(document.getElementById('maxAudioNum').value) || 30,
                promptTianxiaoduo: document.getElementById('promptTianxiaoduo').value,
                promptBaijie: document.getElementById('promptBaijie').value,
                promptXiaoya: document.getElementById('promptXiaoya').value,
                audioKeywords: document.getElementById('audioKeywords').value,
                imageKeywords: document.getElementById('imageKeywords').value,
                nakedKeywords: document.getElementById('nakedKeywords').value,
                comboKeywords: document.getElementById('comboKeywords').value,
                replyTianxiaoduo: document.getElementById('replyTianxiaoduo').value,
                replyBaijie: document.getElementById('replyBaijie').value,
                replyXiaoya: document.getElementById('replyXiaoya').value,
                cityName: document.getElementById('cityName').value,
                petTianxiaoduo: document.getElementById('petTianxiaoduo').value,
                petBaijie: document.getElementById('petBaijie').value,
                petXiaoya: document.getElementById('petXiaoya').value,
                configPassword: document.getElementById('configPassword').value
            };
        }

        function updateSliderDisplay(slider) {
            const val = parseFloat(slider.value);
            const display = Math.round(val * 100) + '%';
            const sibling = slider.parentElement.querySelector('.slider-value');
            if (sibling) sibling.textContent = display;
        }

        document.querySelectorAll('input[type="range"]').forEach(el => {
            el.addEventListener('input', function() { updateSliderDisplay(this); });
        });

        // ============================================================
        //  ★★★ textarea 自适应高度 ★★★
        // ============================================================
        document.querySelectorAll('textarea.prompt').forEach(el => {
            el.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });
            // 初始化触发
            setTimeout(() => {
                el.dispatchEvent(new Event('input'));
            }, 100);
        });

        // ============================================================
        //  保存/恢复/导出/导入
        // ============================================================

        function saveConfig() {
            const config = getFormValues();
            localStorage.setItem('ai_girls_config', JSON.stringify(config));
            showToast('✅ 配置已保存！刷新主页面生效', 'success');
        }

        function resetConfig() {
            if (!confirm('确定恢复所有配置到默认值吗？')) return;
            localStorage.removeItem('ai_girls_config');
            location.reload();
        }

        function exportConfig() {
            const config = getFormValues();
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ai_girls_config.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 配置已导出', 'success');
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const config = JSON.parse(e.target.result);
                    localStorage.setItem('ai_girls_config', JSON.stringify(config));
                    showToast('📥 配置导入成功！刷新页面生效', 'success');
                    loadConfigToForm();
                } catch (err) {
                    showToast('❌ 导入失败：无效的 JSON 文件', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  Toast
        // ============================================================

        let toastTimer = null;

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        //  初始化
        // ============================================================

        loadConfigToForm();

        document.querySelectorAll('input[type="range"]').forEach(el => {
            updateSliderDisplay(el);
        });

        console.log('⚙️ 配置管理已加载');
        console.log('💡 修改后点击「保存配置」，刷新主页面生效');
    </script>
</body>
</html>
