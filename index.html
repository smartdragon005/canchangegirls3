        // ============================================================
        //  天气
        // ============================================================
        const WEATHER_KEYWORDS = ['天气', '温度', '热', '冷', '下雨', '雨', '雪', '阳光', '风', '出门', '穿衣', '预报', '晴', '阴', '雾',
            '降温', '升温', '凉快'
        ];

        async function fetchWeather() {
            const now = Date.now();
            if (weatherCache.data && (now - weatherCache.time) < WEATHER_CACHE_DURATION) {
                return weatherCache.data;
            }
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                // wttr.in 支持拼音/中文名优先；失败 fallback。剧情城市=舒心市（虚构），天气查真实滨州。
                const candidates = [WEATHER_CITY, 'Binzhou', 'Binzhou+Shandong'];
                let lastErr = null;
                for (const c of candidates) {
                    try {
                        const city = encodeURIComponent(c);
                        const resp = await fetch(`https://wttr.in/${city}?format=%C+%t&lang=zh`, { signal: controller.signal });
                        if (!resp.ok) { lastErr = new Error('HTTP ' + resp.status); continue; }
                        const text = await resp.text();
                        if (!text || text.includes('ERROR') || text.includes('Unknown location')) { continue; }
                        const match = text.match(/(.+?)\s+([+-]?\d+°C)/);
                        if (match) {
                            weatherCache.data = { condition: match[1].trim(), temperature: match[2] };
                        } else {
                            weatherCache.data = { condition: text.trim(), temperature: '?' };
                        }
                        weatherCache.time = now;
                        clearTimeout(timeout);
                        return weatherCache.data;
                    } catch (inner) { lastErr = inner; }
                }
                clearTimeout(timeout);
                throw lastErr || new Error('查不到滨州天气');
            } catch (e) {
                console.warn('天气获取失败:', e);
                const fallbacks = [
                    '天气预报明明说有雨但现在风和日丽',
                    '天气软件说下雨，但我看窗外太阳挺好的',
                    '明明报的是多云，结果出大太阳了',
                    '说好的降温呢？我感觉今天还是好热'
                ];
                return { fallback: fallbacks[Math.floor(Math.random() * fallbacks.length)] };
            }
        }

        function isWeatherQuery(text) {
            return WEATHER_KEYWORDS.some(kw => text.includes(kw));
        }

        // ============================================================
        //  时间推算：问"明天/后天/星期X/X号/几点 有空吗/约吗/吃饭吗"
        //  返回：{ hit, targetDate, hourHint, period, rawPhrase }  或  null
        //    targetDate：只保证年月日正确，时分设为12点
        //    hourHint：0-23 或 null
        //    period：'凌晨'|'早上'|'上午'|'中午'|'下午'|'晚上'|null
        // ============================================================
        const TIME_Q_KEYWORDS = ['有空', '约', '吃饭', '见面', '逛街', '看电影', '玩', '出来', '一起', '约会', '时间', '方便', '去', '订', '聚会'];
        const PERIOD_MAP = [
            { name: '凌晨', start: 0, end: 5, hour: 3 },
            { name: '早上', start: 6, end: 8, hour: 7 },
            { name: '上午', start: 9, end: 11, hour: 10 },
            { name: '中午', start: 12, end: 13, hour: 12 },
            { name: '下午', start: 14, end: 17, hour: 15 },
            { name: '晚上', start: 19, end: 22, hour: 20 },
            { name: '夜里', start: 22, end: 24, hour: 23 }
        ];

        function parseTimeQuestion(text, now) {
            const n = now || new Date();
            // 1) 必须有"未来时间"或"有空/约..."关键词之一
            const hasScheduleKW = TIME_Q_KEYWORDS.some(kw => text.includes(kw));

            // 2) 日期偏移：明天 / 后天 / 大后天 / N天后 / 下周X / 星期X / X月X号 / 今天
            let offsetDays = null;
            let rawDate = '';

            if (text.includes('大后天'))      { offsetDays = 3; rawDate = '大后天'; }
            else if (text.includes('后天'))    { offsetDays = 2; rawDate = '后天'; }
            else if (text.includes('明天'))    { offsetDays = 1; rawDate = '明天'; }
            else if (text.includes('今天'))    { offsetDays = 0; rawDate = '今天'; }
            else {
                const afterDays = text.match(/(\d+)\s*(天|日)\s*(后|之后|以后)/);
                if (afterDays) { offsetDays = parseInt(afterDays[1], 10); rawDate = afterDays[0]; }
            }

            // —— 星期判断（周一...周日 / 下周一）
            if (offsetDays === null) {
                const weekdayNameMap = { '日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6 };
                const weekMatch = text.match(/(下下|下|这|本)?\s*星期([日天一二三四五六])/);
                if (weekMatch) {
                    const prefix = weekMatch[1] || '';  // 下/这/下下/空
                    const targetW = weekdayNameMap[weekMatch[2]];
                    const curW = n.getDay();
                    let diff = (targetW - curW + 7) % 7;
                    if (prefix === '下' || prefix === '下个') {
                        // 下星期X = diff===0则+7，否则在原来的diff基础上"下周"语义：
                        // 如果是"下周一"且今天<=周一 → diff + 7
                        if (diff === 0) diff = 7;
                        else diff = diff;  // 实际日常"下周一"如果今天是周三，下周一就是6天后（diff=5）→ 不用再加7
                        // 最稳实现：按"下周"指的是下一个日历周（周日为界）——这里按用户常见语义 diff直接用即可
                    } else if (prefix === '下下') {
                        diff = diff === 0 ? 14 : diff + 7;
                    } else {
                        // 这/本周或无前缀：如果diff=0指今天；用户说"周三有空吗"今天是周三=今天
                        if (diff === 0 && !hasScheduleKW) return null;
                    }
                    offsetDays = diff;
                    rawDate = weekMatch[0];
                }
            }

            // —— X月X号 / X月X日
            if (offsetDays === null) {
                const md = text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[号日]/);
                if (md) {
                    const targetMonth = parseInt(md[1], 10);
                    const targetDay = parseInt(md[2], 10);
                    let year = n.getFullYear();
                    let td = new Date(year, targetMonth - 1, targetDay);
                    if (td.getTime() < n.setHours(0,0,0,0)) td = new Date(year + 1, targetMonth - 1, targetDay);
                    offsetDays = Math.round((td.getTime() - new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime()) / 86400000);
                    rawDate = md[0];
                }
            }

            // 如果没有日期偏移，也没有"今天/明天"等——但如果同时有"几点+有空"，也当作问今天此刻之后有没有空
            let hourHint = null;
            let period = null;

            // 3) 时段匹配：上午/下午/晚上/中午/凌晨/早上/夜里
            for (const p of PERIOD_MAP) {
                if (text.includes(p.name)) { period = p.name; hourHint = p.hour; break; }
            }

            // 4) 具体几点：9点 / 15:30 / 下午3点半
            const hourMatch = text.match(/(凌晨|早上|上午|中午|下午|晚上|夜里)?\s*(\d{1,2})\s*(点|:|时)\s*(\d{1,2})?(半|分)?/);
            if (hourMatch) {
                let h = parseInt(hourMatch[2], 10);
                const m = hourMatch[4] ? parseInt(hourMatch[4], 10) : 0;
                const prefixP = hourMatch[1];
                // 如果是"下午3点"这种，+12
                if ((prefixP === '下午' || prefixP === '晚上' || prefixP === '夜里') && h < 12) h += 12;
                if (prefixP === '中午' && h === 12) h = 12;
                hourHint = h;
                // 精确时段名
                for (const p of PERIOD_MAP) {
                    if (h >= p.start && h <= p.end) { period = p.name; break; }
                }
                rawDate = (rawDate ? rawDate + ' ' : '') + hourMatch[0];
            }

            // 5) 最终命中判定：必须 (offsetDays!==null 或 今天日期已识别) 且 (hasScheduleKW 或 hourHint 或 period)
            const hasTimeLike = (offsetDays !== null) || hourHint !== null || period;
            if (!hasTimeLike || !(hasScheduleKW || hourHint !== null || period || offsetDays !== null)) {
                // 宽松点：只要识别到了日期偏移，就算是问"那天空不空"
                if (offsetDays === null) return null;
            }
            if (offsetDays === null) offsetDays = 0; // 默认今天

            // 构造 targetDate（目标日12:00，或指定hour）
            const targetDate = new Date(n.getFullYear(), n.getMonth(), n.getDate() + offsetDays,
                (hourHint !== null ? hourHint : 12),
                (hourMatch && hourMatch[4] ? parseInt(hourMatch[4],10) : 0));

            return {
                hit: true,
                targetDate,
                hourHint,
                period,
                rawPhrase: rawDate || '今天',
                offsetDays
            };
        }

        // ============================================================
        //  日程表（按真实日期判断，支持未来日期 → 复用 getStatusTag 的精确逻辑）
        //  返回：当天一句话描述（粗略级别）
        // ============================================================
        function getScheduleByDate(personaId, dateOrWeekday) {
            const targetDate = (dateOrWeekday instanceof Date)
                ? dateOrWeekday
                : null;

            // 兼容旧调用：如果传的是weekday（数字/字符串），就继续用粗粒度
            if (!targetDate) {
                const dayName = typeof dateOrWeekday === 'string' ? dateOrWeekday : ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][dateOrWeekday];
                // 旧逻辑保留，只是为了兼容可能的直接调用；实际 buildSystemPrompt 会传Date
                if (personaId === 'tianxiaoduo') return (dayName === '周日') ? '休息日，不上班' : '正常白班（如有大夜班则是通宵值班）';
                if (personaId === 'baijie') return '白班/夜班随日期上下半月切换';
                if (personaId === 'xiaoya') {
                    if (dayName === '周三' || dayName === '周六') return '休息日';
                    if (dayName === '周二' || dayName === '周五') return '书店上班 + 晚上驻唱';
                    return '书店上班';
                }
                return '上班';
            }

            // 传了真实 Date → 用 getStatusTag 在 9/14/21 三个点取样，拼接一句话
            const dayOnly = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const morning = getStatusTag(new Date(dayOnly.getTime() + 10 * 3600 * 1000), personaId); // 上午10点
            const afternoon = getStatusTag(new Date(dayOnly.getTime() + 15 * 3600 * 1000), personaId); // 下午15点
            const evening = getStatusTag(new Date(dayOnly.getTime() + 21 * 3600 * 1000), personaId); // 晚上21点
            const parts = [];
            if (morning.cls === 'working') parts.push(`上午${morning.label.replace(/中$/,'')}`);
            else if (morning.cls === 'sleeping') parts.push('上午补觉');
            else if (morning.label && morning.label !== '在线') parts.push(`上午${morning.label}`);
            if (afternoon.cls === 'working') parts.push(`下午${afternoon.label.replace(/中$/,'')}`);
            else if (afternoon.cls === 'resting') parts.push('下午午休');
            else if (afternoon.cls === 'sleeping') parts.push('下午补觉');
            else if (afternoon.label && afternoon.label !== '在线') parts.push(`下午${afternoon.label}`);
            if (evening.cls === 'singing') parts.push('晚上驻唱');
            else if (evening.cls === 'working') parts.push(`晚上${evening.label.replace(/中$/,'')}`);
            else if (evening.cls === 'sleeping') parts.push('晚上已休息');
            else if (evening.label === '休息日') parts.push('晚上休息');
            return parts.length ? parts.join('，') : '自由活动';
        }
        // 兼容旧函数名 getSchedule → 指向新的 getScheduleByDate
        function getSchedule(personaId, dateOrWeekday) {
            return getScheduleByDate(personaId, dateOrWeekday);
        }

        // 获取今天、明天、后天的日期信息
        function getDateInfo() {
            const now = new Date();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const today = new Date(now);
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const dayAfter = new Date(now);
            dayAfter.setDate(dayAfter.getDate() + 2);

            return {
                today: { date: today.getDate(), weekday: weekdays[today.getDay()], month: today.getMonth() + 1 },
                tomorrow: { date: tomorrow.getDate(), weekday: weekdays[tomorrow.getDay()], month: tomorrow.getMonth() + 1 },
                dayAfter: { date: dayAfter.getDate(), weekday: weekdays[dayAfter.getDay()], month: dayAfter.getMonth() + 1 }
            };
        }

        // ============================================================
        //  System Prompt（自动替换年龄 + 注入日期日程 + 位置数据）
        // ============================================================
        function buildSystemPrompt(persona, userMessage, weather) {
            const timeInfo = getTimeInfo();
            const status = getStatusTag(timeInfo.now, persona.id);
            const age = calculateAge(persona.birthday);

            // ============ 今天第一轮聊天检测 ============
            const dailyInfo = checkDailyFirst(persona.id, timeInfo.now);

            let prompt = persona.systemPrompt.replace(/今年\d+岁/, `今年${age}岁`);

            // 日期和日程（升级：传真实 Date 给 getSchedule → 得到精确状态，包含大夜班/上下半月/驻唱/周日休息）
            const dateInfo = getDateInfo();
            const todayDate = new Date(timeInfo.now.getFullYear(), timeInfo.now.getMonth(), timeInfo.now.getDate());
            const tomorrowDate = new Date(todayDate.getTime() + 86400000);
            const dayAfterDate = new Date(todayDate.getTime() + 86400000 * 2);
            const todaySchedule = getSchedule(persona.id, todayDate);
            const tomorrowSchedule = getSchedule(persona.id, tomorrowDate);
            const dayAfterSchedule = getSchedule(persona.id, dayAfterDate);

            prompt += `\n\n📅 日期信息：`;
            prompt += `\n今天（${dateInfo.today.month}月${dateInfo.today.date}日 ${dateInfo.today.weekday}）：${todaySchedule}`;
            prompt += `\n明天（${dateInfo.tomorrow.month}月${dateInfo.tomorrow.date}日 ${dateInfo.tomorrow.weekday}）：${tomorrowSchedule}`;
            prompt += `\n后天（${dateInfo.dayAfter.month}月${dateInfo.dayAfter.date}日 ${dateInfo.dayAfter.weekday}）：${dayAfterSchedule}`;
            prompt += `\n当用户问到「明天」「后天」「几号」「星期几」时，请根据上面提供的日期信息准确回答。`;

            // ========== 时间推算精准化：问"明天X点有空吗/约吗" ==========
            const tq = parseTimeQuestion(userMessage || '', timeInfo.now);
            if (tq && tq.hit) {
                try {
                    // 1) 指定时段的精确状态（传给getStatusTag用的就是targetDate的年月日时分 → 上下半月/星期/mod7大夜班 都自动算对）
                    const exactStatus = getStatusTag(tq.targetDate, persona.id);
                    const td = tq.targetDate;
                    const weekdaysArr = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                    const dateStr = `${td.getFullYear()}-${td.getMonth()+1}-${td.getDate()} ${weekdaysArr[td.getDay()]}`;
                    const timeStr = tq.hourHint !== null
                        ? `${String(tq.hourHint).padStart(2,'0')}:${String(td.getMinutes()).padStart(2,'0')}（${tq.period || ''}）`
                        : (tq.period ? tq.period : '全天');
                    prompt += `\n\n⏰【用户询问未来时间（排班真实情况提醒）】`;
                    prompt += `\n用户问的时间是：「${tq.rawPhrase}」→ 对应 ${dateStr} ${timeStr}`;
                    prompt += `\n你（${persona.name}）在该时点的真实排班状态是：【${exactStatus.icon} ${exactStatus.label}】（类别=${exactStatus.cls}）`;
                    prompt += `\n请严格按照这个真实状态回答：`;
                    prompt += `\n- 如果是 working=上班/大夜班/驻唱 → 就说上班忙/没时间/只有休息时间有空/约下班后；`;
                    prompt += `\n- 如果是 sleeping=睡觉/补觉 → 就说那个时候在睡觉，不太方便；`;
                    prompt += `\n- 如果是 resting=午休 → 就说午休时间可以聊几句但不方便出门；`;
                    prompt += `\n- 如果是 free=休息/已下班/休息日 → 就说有空/可以约，语气开心期待。`;
                    prompt += `\n绝对不要瞎编，不要说"我不确定/可能有空"这种含糊话，就按上面事实回答。`;

                    // 2) 额外给 AI 列一下当天"上午10 / 下午15 / 晚上21"三个时段的状态，方便回答整天
                    const d0 = new Date(td.getFullYear(), td.getMonth(), td.getDate());
                    const s1 = getStatusTag(new Date(d0.getTime() + 10*3600*1000), persona.id);
                    const s2 = getStatusTag(new Date(d0.getTime() + 15*3600*1000), persona.id);
                    const s3 = getStatusTag(new Date(d0.getTime() + 21*3600*1000), persona.id);
                    prompt += `\n（当天参考：上午10点=${s1.icon}${s1.label} / 下午3点=${s2.icon}${s2.label} / 晚上9点=${s3.icon}${s3.label}）`;
                } catch (e) { console.warn('时间推算注入失败', e); }
            }

            prompt +=
                `\n\n当前时间：${timeInfo.year}年${timeInfo.month}月${timeInfo.day}日 ${timeInfo.weekday} ${timeInfo.ampm} ${String(timeInfo.hour).padStart(2,'0')}:${String(timeInfo.minute).padStart(2,'0')}:${String(timeInfo.second).padStart(2,'0')}`;
            prompt += `\n当前季节：${timeInfo.season}天`;
            if (timeInfo.term) prompt += `\n今日节气：${timeInfo.term}`;
            if (timeInfo.holiday) prompt += `\n今日节日：${timeInfo.holiday}`;

            // ============ 第一轮聊天主动问候：节日/节气（立春/清明/立夏/立秋/立冬/冬至） + 男朋友生日 ============
            if (dailyInfo.firstTime) {
                // 1) 如果今天是男朋友生日 → 优先级最高，甜蜜祝福必须放在回复最开头
                if (timeInfo.isUserBirthday) {
                    prompt += `\n\n【🔥 第一轮聊天 · 男朋友生日！】：这是今天${timeInfo.year}-${timeInfo.month}-${timeInfo.day}你和用户的第一次对话！`;
                    prompt += `\n今天是${persona.name}的男朋友（也就是用户）的生日！`;
                    prompt += `你必须以${persona.name}自己的角色身份和语气，在【回复的第一句话】主动送上一句甜蜜又自然的生日祝福，`;
                    prompt += `要像女朋友撒娇/撩汉的口吻（可以说爱你、么么哒、想给你一个拥抱、晚上一起吃蛋糕、准备了小惊喜、祝你每天开心之类），`;
                    prompt += `控制在20~50个字，不要生硬，不要加括号，不要写"祝福"二字。`;
                } else {
                    // 2) 普通节日/节气问候
                    const greetTargets = [];
                    if (timeInfo.holidaysToday && timeInfo.holidaysToday.length) {
                        greetTargets.push(...timeInfo.holidaysToday);
                    }
                    if (timeInfo.term && TERMS_AS_HOLIDAY.has(timeInfo.term)) {
                        greetTargets.push(timeInfo.term + '节气');
                    }
                    if (greetTargets.length) {
                        const greetStr = Array.from(new Set(greetTargets)).join('、');
                        prompt += `\n\n【第一轮聊天提醒】：这是今天${timeInfo.year}-${timeInfo.month}-${timeInfo.day}用户和你的第一次对话。`;
                        prompt += `今天是「${greetStr}」，请用你自己（${persona.name}）的角色风格和语气，`;
                        prompt += `主动在回复开头自然送上一句简短的${greetStr}问候或小提醒（不要超过30个字，不要生硬，像女朋友随口提的）。`;
                    }
                }
            } else if (timeInfo.isUserBirthday) {
                // 3) 不是第一轮，但今天是男朋友生日 → 提醒AI聊天里可以随时提到生日
                prompt += `\n\n💡 今天是男朋友的生日！聊天中如果有自然的机会，可以随时送上祝福或聊到生日相关的话题。`;
            }

            prompt += `\n\n${persona.name}当前状态：${status.icon} ${status.label}`;

            prompt += `\n城市：${CITY_NAME}`;
            prompt += `\n真实天气查询城市：${WEATHER_CITY}（剧情里的${CITY_NAME}是虚构城市，闲聊时请仍然说${CITY_NAME}）`;

            if (weather) {
                if (weather.fallback) {
                    prompt += `\n天气：${weather.fallback}`;
                } else {
                    prompt += `\n当前${WEATHER_CITY}的天气：${weather.condition}，${weather.temperature}`;
                }
            }

            const moods = {
                'working': '专注认真',
                'resting': '放松慵懒',
                'sleeping': '困倦温柔',
                'free': '轻松愉快',
                'singing': '兴奋投入'
            };
            prompt += `\n当前情绪：${moods[status.cls] || '平静'}`;

            prompt += `\n\n用户是你的男朋友。用户同时有三个女朋友：甜小朵、白洁、小雅。你们三人互相认识，知道彼此的存在。`;

            const petNames = {
                'tianxiaoduo': CONFIG.petTianxiaoduo || '宝贝',
                'baijie': CONFIG.petBaijie || '亲爱的',
                'xiaoya': CONFIG.petXiaoya || '你'
            };
            prompt += `\n你对用户的称呼是「${petNames[persona.id] || '亲爱的'}」。`;

            // 位置数据
            if (CITY_DATA) {
                prompt += `\n\n📍 舒心市位置数据（用户问到位置时请据此回答）：`;
                for (const item of CITY_DATA.landmarks) {
                    prompt += `\n- ${item.name}：${item.district}${item.address}`;
                }
                for (const p of CITY_DATA.personas) {
                    prompt += `\n- ${p.name}的家：${p.district}${p.address}`;
                    prompt += `\n- ${p.workplace}：${p.district}${p.workAddr}`;
                }
                prompt += `\n当用户问「在哪里」「在哪」「地址」「怎么走」时，请从上面的位置数据中查找并准确回答。`;
            }

            // 返回 { prompt, dailyInfo }——调用方用完prompt后自己mark daily done
            return { prompt, dailyInfo };
        }

        // ============================================================
        //  渲染
        // ============================================================

        function renderPersonas() {
            personaBar.innerHTML = '';
            if (!PERSONAS || PERSONAS.length === 0) return;
            PERSONAS.forEach(p => {
                const div = document.createElement('div');
                div.className = 'persona-item' + (p.id === (currentPersona ? currentPersona.id : '') ? ' active' : '');
                div.dataset.id = p.id;
                div.innerHTML = `
                    <img class="pavatar" src="${p.avatar}" onerror="this.src='/img/default-avatar.jpg'">
                    <span class="pname">${p.name}</span>
                `;
                div.onclick = () => switchPersona(p.id);
                personaBar.appendChild(div);
            });
        }

        function switchPersona(id) {
            const p = PERSONAS.find(p => p.id === id);
            if (!p || p.id === (currentPersona ? currentPersona.id : '')) return;
            if (currentAudioElement) { currentAudioElement.pause();
                currentAudioElement = null;
                currentAudioWrapper = null; }
            currentPersona = p;
            updateHeader();
            renderMessages();
            userInput.focus();

            document.querySelectorAll('.persona-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });
        }

        function updateHeader() {
            if (!currentPersona) return;
            headerAvatarImg.src = currentPersona.avatar;
            headerAvatarImg.onerror = () => { headerAvatarImg.src = '/img/default-avatar.jpg'; };
            headerName.textContent = currentPersona.name;
            updateStatusTag();
        }

        function updateStatusTag() {
            if (!currentPersona) return;
            const status = getStatusTag(new Date(), currentPersona.id);
            statusTag.textContent = status.icon + ' ' + status.label;
            statusTag.className = 'status-tag ' + status.cls;
        }

        function renderMessages() {
            messageArea.innerHTML = '';
            const history = getHistory();
            if (!currentPersona) {
                const div = document.createElement('div');
                div.className = 'message bot';
                div.innerHTML = `⏳ 加载中...`;
                messageArea.appendChild(div);
                return;
            }
            if (history.length === 0) {
                const div = document.createElement('div');
                div.className = 'message bot';
                div.innerHTML = `👋 你好，我是 ${currentPersona.name}。<span class="time">${getTime()}</span>`;
                messageArea.appendChild(div);
                return;
            }
            history.forEach(msg => {
                const div = document.createElement('div');
                const displayRole = msg.role === 'assistant' ? 'bot' : msg.role;
                div.className = 'message ' + (displayRole === 'user' ? 'user' : 'bot');
                if (msg.role === 'user') {
                    div.innerHTML = msg.content + `<span class="time">${msg.time || getTime()}</span>`;
                } else {
                    const contentDiv = document.createElement('div');
                    if (msg.type === 'image') {
                        const img = document.createElement('img');
                        img.src = msg.content;
                        img.className = 'msg-image';
                        img.onerror = () => { img.style.display = 'none'; };
                        contentDiv.appendChild(img);
                    } else if (msg.type === 'audio') {
                        const duration = msg.duration || getMockDuration();
                        const audioUI = createAudioUI(msg.content, duration);
                        contentDiv.appendChild(audioUI);
                    } else if (msg.type === 'combo') {
                        if (msg.text) {
                            const textP = document.createElement('div');
                            textP.textContent = msg.text;
                            contentDiv.appendChild(textP);
                        }
                        if (msg.image) {
                            const img = document.createElement('img');
                            img.src = msg.image;
                            img.className = 'msg-image';
                            img.onerror = () => { img.style.display = 'none'; };
                            contentDiv.appendChild(img);
                        }
                        if (msg.audio) {
                            const duration = msg.audioDuration || getMockDuration();
                            const audioUI = createAudioUI(msg.audio, duration);
                            contentDiv.appendChild(audioUI);
                        }
                    } else {
                        const content = msg.content || '';
                        if (isImagePath(content)) {
                            const img = document.createElement('img');
                            img.src = content;
                            img.className = 'msg-image';
                            img.onerror = () => { img.style.display = 'none'; };
                            contentDiv.appendChild(img);
                        } else if (isAudioPath(content)) {
                            const duration = getMockDuration();
                            const audioUI = createAudioUI(content, duration);
                            contentDiv.appendChild(audioUI);
                        } else {
                            contentDiv.textContent = content;
                        }
                    }
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = msg.time || getTime();
                    contentDiv.appendChild(timeSpan);
                    div.appendChild(contentDiv);
                }
                messageArea.appendChild(div);
            });
            messageArea.scrollTop = messageArea.scrollHeight;
            updateStatusTag();
        }

        // ============================================================
        //  音频 UI
        // ============================================================
        function createAudioUI(audioSrc, duration) {
            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            const btn = document.createElement('button');
            btn.className = 'audio-play-btn';
            btn.textContent = '▶';
            const wave = document.createElement('div');
            wave.className = 'audio-wave';
            const barCount = 20;
            const bars = [];
            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (4 + Math.random() * 18) + 'px';
                wave.appendChild(bar);
                bars.push(bar);
            }
            const durSpan = document.createElement('span');
            durSpan.className = 'audio-duration';
            const mins = Math.floor(duration / 60);
            const secs = duration % 60;
            durSpan.textContent = mins > 0 ? `${mins}'${String(secs).padStart(2,'0')}"` : `${secs}"`;
            wrapper.appendChild(btn);
            wrapper.appendChild(wave);
            wrapper.appendChild(durSpan);

            const audio = new Audio(audioSrc);
            audio.preload = 'metadata';
            let isPlaying = false;
            let progressInterval = null;

            function updateProgress() {
                if (!audio.duration) return;
                const progress = audio.currentTime / audio.duration;
                const activeCount = Math.floor(progress * barCount);
                bars.forEach((bar, idx) => {
                    bar.className = 'bar';
                    if (idx < activeCount) bar.classList.add('played');
                    if (idx === activeCount && idx < barCount - 1) bar.classList.add('active');
                });
                // 时长数字固定显示总时长，不随播放变动
            }

            function resetWave() {
                bars.forEach(bar => { bar.className = 'bar';
                    bar.style.height = (4 + Math.random() * 18) + 'px'; });
                durSpan.textContent = mins > 0 ? `${mins}'${String(secs).padStart(2,'0')}"` : `${secs}"`;
            }

            function togglePlay() {
                if (isPlaying) {
                    audio.pause();
                } else {
                    if (currentAudioElement && currentAudioElement !== audio) {
                        currentAudioElement.pause();
                        if (currentAudioWrapper) {
                            const oldBtn = currentAudioWrapper.querySelector('.audio-play-btn');
                            if (oldBtn) { oldBtn.textContent = '▶';
                                oldBtn.classList.remove('playing'); }
                            const oldWave = currentAudioWrapper.querySelector('.audio-wave');
                            if (oldWave) {
                                oldWave.querySelectorAll('.bar').forEach(bar => {
                                    bar.className = 'bar';
                                    bar.style.height = (4 + Math.random() * 18) + 'px';
                                });
                            }
                            const oldDur = currentAudioWrapper.querySelector('.audio-duration');
                            if (oldDur) {
                                oldDur.textContent = mins > 0 ? `${mins}'${String(secs).padStart(2,'0')}"` : `${secs}"`;
                            }
                        }
                    }
                    audio.play();
                }
            }

            audio.addEventListener('play', () => {
                isPlaying = true;
                btn.textContent = '⏸';
                btn.classList.add('playing');
                currentAudioElement = audio;
                currentAudioWrapper = wrapper;
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 100);
            });

            audio.addEventListener('pause', () => {
                isPlaying = false;
                btn.textContent = '▶';
                btn.classList.remove('playing');
                if (progressInterval) { clearInterval(progressInterval);
                    progressInterval = null; }
            });

            audio.addEventListener('ended', () => {
                isPlaying = false;
                btn.textContent = '▶';
                btn.classList.remove('playing');
                if (progressInterval) { clearInterval(progressInterval);
                    progressInterval = null; }
                resetWave();
                audio.currentTime = 0;
                if (currentAudioElement === audio) { currentAudioElement = null;
                    currentAudioWrapper = null; }
            });

            audio.addEventListener('error', () => {
                btn.textContent = '⚠';
                btn.style.background = '#888';
                durSpan.textContent = '加载失败';
            });

            btn.addEventListener('click', (e) => { e.stopPropagation();
                togglePlay(); });
            wave.addEventListener('click', (e) => {
                if (!audio.duration) return;
                const rect = wave.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                audio.currentTime = x * audio.duration;
                updateProgress();
            });

            audio.addEventListener('loadedmetadata', () => {
                const realDur = Math.floor(audio.duration);
                if (realDur > 0) {
                    const m = Math.floor(realDur / 60);
                    const s = realDur % 60;
                    durSpan.textContent = m > 0 ? `${m}'${String(s).padStart(2,'0')}"` : `${s}"`;
                }
            });

            return wrapper;
        }

        // 根据当前角色获取配置的声音
        function getCurrentVoice() {
            if (!currentPersona) return CONFIG.ttsVoiceTianxiaoduo || 'Cherry';
            const id = currentPersona.id;
            // 从localStorage覆盖值读取，没有则用CONFIG默认
            const override = localStorage.getItem('ai_tts_voice_' + id);
            if (override) return override;
            if (id === 'tianxiaoduo') return CONFIG.ttsVoiceTianxiaoduo || 'Cherry';
            if (id === 'baijie') return CONFIG.ttsVoiceBaijie || 'Serena';

        }

        function getTTSModel() {
            const m = localStorage.getItem('ai_tts_model');
            return m || CONFIG.ttsModel || 'qwen3-tts-flash';
        }

        function getTTSEndpoint(model) {
            // qwen3-tts-flash / qwen3-tts 走 dashscope 通用端点
            // qwen-audio / cosyvoice 走 workspace 端点（这里默认通用，需要workspace的让用户改CONFIG）
            if (model && (model.startsWith('qwen-audio') || model.startsWith('cosyvoice'))) {
                // 需要 workspaceId，暂时先用默认端点；如果用户填了CONFIG.ttsEndpoint则覆盖
                const ws = localStorage.getItem('ai_tts_workspace') || '';
                if (ws) {
                    return `https://${ws}.cn-beijing.maas.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer`;
                }
            }
            return CONFIG.ttsEndpoint || 'https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation';
        }

        /**
         * 调用百炼TTS把文字转成语音
         * @param {string} text 要合成的文字
         * @param {string} voice 声音名（可选，默认用当前角色声音）
         * @returns {Promise<{audioUrl: string, duration: number}|null>} 成功返回音频URL+时长，失败返回null
         */
        async function callBailianTTS(text, voice) {
            const key = ttsKeyInput.value.trim() || ttsApiKey;
            if (!key) {
                console.warn('[TTS] 未配置百炼API Key');
                return null;
            }
            if (!text || !text.trim()) return null;

            const model = getTTSModel();
            const endpoint = getTTSEndpoint(model);
            const useVoice = voice || getCurrentVoice();

            const isDashscopeGen = endpoint.includes('multimodal-generation');
            const isSpeechSynth = endpoint.includes('SpeechSynthesizer');

            let body;
            if (isSpeechSynth) {
                // CosyVoice / Qwen-Audio-TTS 接口结构
                body = {
                    model: model,
                    input: {
                        text: text,
                        voice: useVoice,
                        format: 'mp3',
                        sample_rate: 24000
                    }
                };
            } else {
                // DashScope multimodal-generation (qwen3-tts) 接口结构
                body = {
                    model: model,
                    input: {
                        text: text,
                        voice: useVoice,
                        language_type: 'Chinese'
                    }
                };
            }

            try {
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify(body)
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    console.error('[TTS] HTTP错误', resp.status, errText.slice(0, 300));
                    return null;
                }

                const data = await resp.json();

                // 尝试几种常见返回格式
                let audioUrl = null;
                let duration = null;

                // qwen3-tts (dashscope multimodal) 格式
                if (data && data.output && data.output.audio && data.output.audio.url) {
                    audioUrl = data.output.audio.url;
                    if (data.output.audio.duration) duration = Math.round(data.output.audio.duration);
                }
                // SpeechSynthesizer 格式
                else if (data && data.output && data.output.audio_url) {
                    audioUrl = data.output.audio_url;
                } else if (data && data.output && data.output.url) {
                    audioUrl = data.output.url;
                }
                // 通用兜底
                else if (data && typeof data === 'object') {
                    const search = (obj) => {
                        for (const k of Object.keys(obj)) {
                            const v = obj[k];
                            if (typeof v === 'string' && (v.startsWith('http') && (v.includes('.mp3') || v.includes('.wav') || v.includes('audio') || v.includes('aliyuncs')))) {
                                return v;
                            }
                            if (v && typeof v === 'object') {
                                const r = search(v);
                                if (r) return r;
                            }
                        }
                        return null;
                    };
                    audioUrl = search(data);
                }

                if (!audioUrl) {
                    console.error('[TTS] 找不到音频URL，返回数据：', JSON.stringify(data).slice(0, 500));
                    return null;
                }

                // 如果没有返回duration，用Audio元素探测（或默认3~8秒）
                if (!duration) {
                    duration = Math.min(30, Math.max(3, Math.round(text.length / 4)));
                }

                return { audioUrl, duration: duration || 5 };
            } catch (e) {
                console.error('[TTS] 调用异常：', e);
                return null;
            }
        }

        // ============================================================
        //  关键词触发（★ 从当前角色读取独立参数 ★）
        // ============================================================
        function containsKeyword(text, keywords) {
            return keywords.some(kw => text.includes(kw));
        }

        const AUDIO_KEYWORDS = [
            '声音', '说话', '语音', '哼两句', '说句话'
        ];

        // ★★★ OHMYGOD 关键词：50%固定概率触发当前角色的本地音频（不走TTS）★★★
        const OHMYGOD_KEYWORDS = ['大大', '小小'];
        const OHMYGOD_PROB = 0.5;  // 三人共用：50%概率
        const OHMYGOD_COOLDOWN_MS = 5000;  // 触发后5秒冷却，防止快速连点
        let ohmygodCooldownUntil = 0;      // 冷却结束时间戳

        const IMAGE_KEYWORDS = [
            '照片', '自拍', '看看你', '美照', '发张照片',
            '我想看看你', '露脸', '瞅瞅', '穿什么', '来一张'
        ];

        const NAKED_KEYWORDS = [
            '脱光','做爱','操你','操我','上床','阴茎','阴唇','逼','肉体'
        ];

        const ALL_IMAGE_KEYWORDS = [...IMAGE_KEYWORDS, ...NAKED_KEYWORDS];
        const COMBO_KEYWORDS = ['想你了', '晚安', '早安', '抱抱', '亲亲'];
        const COMBO_REPLIES = {
            '想你了': '我也想你呀～',
            '晚安': '晚安，好梦～',
            '早安': '早安呀～',
            '抱抱': '抱抱～',
            '亲亲': 'mua～'
        };

        function handleKeywordTrigger(userText) {
            // ============ OHMYGOD 关键词：固定50%概率触发本地音频（不走TTS）============
            if (containsKeyword(userText, OHMYGOD_KEYWORDS)) {
                const now = Date.now();
                if (now < ohmygodCooldownUntil) {
                    // 冷却期内（5秒内已触发过）→ 直接忽略，什么也不推，也不继续走AI
                    return null;
                }
                if (Math.random() < OHMYGOD_PROB) {
                    ohmygodCooldownUntil = now + OHMYGOD_COOLDOWN_MS;  // 命中后开5秒冷却
                    // 直接走当前角色本地音频文件夹随机一个，不需要AI回复
                    return { type: 'audio', path: getRandomAudioPath(), needTTS: false };
                }
                // 50%概率不触发，继续走下面的正常逻辑
            }

            const matchedCombo = COMBO_KEYWORDS.find(kw => userText.includes(kw));
            const isAudio = containsKeyword(userText, AUDIO_KEYWORDS);
            const isImage = containsKeyword(userText, ALL_IMAGE_KEYWORDS);
            const isNaked = containsKeyword(userText, NAKED_KEYWORDS);

            // ★★★ 从当前角色读取独立参数 ★★★
            const mediaProb = getMediaProb();
            const nakedProb = getNakedProb();

            let shouldMedia;
            if (isNaked) {
                shouldMedia = Math.random() < nakedProb;
            } else {
                shouldMedia = Math.random() < mediaProb;
            }

            if (!shouldMedia) {
                return null;
            }

            if (matchedCombo) {
                // ★ 组合词：图片 + AI回复→TTS语音（后期你可自行改关键词）
                return {
                    type: 'combo',
                    text: COMBO_REPLIES[matchedCombo] || '',
                    image: getRandomImagePath(isNaked),
                    fallbackAudio: getRandomAudioPath(),
                    needTTS: true
                };
            }

            if (isAudio && isImage) {
                // ★ 语音+图片组合关键词：图片 + AI回复→TTS语音
                return {
                    type: 'combo',
                    text: '',
                    image: getRandomImagePath(isNaked),
                    fallbackAudio: getRandomAudioPath(),
                    needTTS: true
                };
            }

            if (isAudio) {
                // ★ 纯语音关键词：AI回复→TTS语音，不显示文字
                return { type: 'audio', fallbackPath: getRandomAudioPath(), needTTS: true };
            }

            if (isImage) {
                return { type: 'image', path: getRandomImagePath(isNaked) };
            }

            return null;
        }

        // ============================================================
        //  用户生日（农历 十月廿六 → 每年公历日期对照表，2024-2030 准确值）
        //  说明：以万年历为准已核对；2025年修正为12-16
        // ============================================================
        const LUNAR_BIRTHDAYS = {
            2024: '11-26',
            2025: '12-16',
            2026: '12-05',
            2027: '11-24',
            2028: '12-12',
            2029: '12-01',
            2030: '11-20'
        };

        function getUserBirthday(yearOrNow) {
            const y = (typeof yearOrNow === 'number')
                ? yearOrNow
                : (yearOrNow instanceof Date ? yearOrNow.getFullYear() : new Date().getFullYear());
            return LUNAR_BIRTHDAYS[y] || LUNAR_BIRTHDAYS[2026];
        }
        const USER_BIRTHDAY_NAME = '男朋友生日';   // 作为节日名拼进节日表，让AI代入感更强

        // ============================================================
        //  每周总结
        // ============================================================
        function checkWeekSummary(now, userMessage) {
            const weekday = now.getDay();
            const hour = now.getHours();
            if (weekday !== 0 || hour < 20) return null;

            const key = 'week_summary_' + currentPersona.id + '_' + getDateStr();
            if (localStorage.getItem(key)) return null;

            const history = getHistory();
            if (history.length < 2) return null;

            localStorage.setItem(key, 'true');
            return `（这周我们聊了好多呢～感觉你${Math.random() > 0.5 ? '工作有点忙' : '心情还不错'}，下周也要加油哦💪）`;
        }

        // ============================================================
        //  位置查询处理
        // ============================================================
        function handleLocationQueryText(userText) {
            if (!isLocationQuery(userText)) return null;
            if (!CITY_DATA) return null;

            const result = findLocation(userText, CITY_DATA.landmarks, CITY_DATA.personas);
            if (!result.found) return null;

        // ============================================================
        //  API 调用（★ 从当前角色读取 maxTokens ★）
        //  options.ttsMode: true 表示文字用于转语音，不直接显示
        //  options.mediaAttach: {type:'combo'|'audio', image?, fallbackAudio?, fallbackPath?} 附加媒体信息
        // ============================================================
        async function callDeepSeek(userMessage, options = {}) {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showSystemMessage('⚠️ 请先配置 DeepSeek API Key');
                return;
            }

            const ttsMode = !!options.ttsMode;
            const mediaAttach = options.mediaAttach || null;

            const now = new Date();
            if (shouldDefaultReply(currentPersona.id, now)) {
                const reply = getDefaultReply(currentPersona.id);
                if (ttsMode) {
                    // TTS模式下也处理默认回复
                    await handleTTSFinalize(reply, mediaAttach);
                } else {
                    addMessage(reply, 'bot');
                }
                return;
            }

            const summary = checkWeekSummary(now, userMessage);
            if (summary) {
                addMessage(summary, 'bot');
            }

            let weather = null;
            if (isWeatherQuery(userMessage)) {
                weather = await fetchWeather();
            }

            // buildSystemPrompt 现在返回 { prompt, dailyInfo }
            const sp = buildSystemPrompt(currentPersona, userMessage, weather);
            const systemPrompt = sp.prompt;
            const dailyInfo = sp.dailyInfo;

            const history = getHistory();
            const maxHistory = getMaxHistory();
            const context = history.slice(-maxHistory);

            // TTS模式下给AI加一个简短提示：让回复更口语化、适合朗读（2-4句话最佳）
            let finalPrompt = systemPrompt;
            if (ttsMode) {
                finalPrompt = systemPrompt + '\n\n【额外要求】你这次的回复会被转成语音播放给用户听，所以请：1）用口语化自然表达；2）控制在3句话以内、不要太长；3）不要用markdown、括号说明或表情符号。';
            }

            const messages = [
                { role: 'system', content: finalPrompt },
                ...context.map(h => ({ role: h.role, content: h.content }))
            ];

            // ★★★ 从当前角色读取 maxTokens ★★★
            const maxTokens = getMaxTokens();

            isWaiting = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: messages,
                        temperature: 0.9,
                        max_tokens: maxTokens
                    })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message || 'API 调用失败');
                let reply = data.choices[0].message.content;
                // 简单清理
                reply = reply.replace(/[\*_#>`\[\]()]/g, '').trim();

                if (ttsMode) {
                    await handleTTSFinalize(reply, mediaAttach);
                } else {
                    addMessage(reply, 'bot');
                }
                // AI回复成功 → 本轮"第一次问候"机会已用掉
                if (dailyInfo && dailyInfo.firstTime) markDailyDone(dailyInfo.key);
            } catch (e) {
                showSystemMessage('❌ 请求失败：' + e.message);
            } finally {
                removeTyping();
                isWaiting = false;
                sendBtn.disabled = false;
            }
        }

        /**
         * TTS模式收尾：根据TTS成功与否决定推音频气泡还是文字/本地音频
         */
        async function handleTTSFinalize(aiReplyText, mediaAttach) {
            const attachType = mediaAttach ? mediaAttach.type : 'audio'; // audio | combo
            const ttsKeyOk = !!(ttsKeyInput.value.trim() || ttsApiKey);

            // 步骤1：尝试TTS
            let ttsResult = null;
            if (ttsKeyOk && aiReplyText) {
                ttsResult = await callBailianTTS(aiReplyText);
            }

            // 步骤2：根据类型+成功与否推消息
            if (attachType === 'combo') {
                // --- 组合消息：图片 + 音频/文字 ---
                let finalAudio = null;
                let finalAudioDuration = null;
                let textToShow = '';

                if (ttsResult) {
                    // TTS成功 → 用TTS音频
                    finalAudio = ttsResult.audioUrl;
                    finalAudioDuration = ttsResult.duration;
                } else if (mediaAttach && mediaAttach.fallbackAudio) {
                    // TTS失败 → 用本地音频兜底
                    finalAudio = mediaAttach.fallbackAudio;
                    finalAudioDuration = getMockDuration();
                    // 按你的要求：TTS失败就把AI文字显示出来
                    textToShow = aiReplyText || '';
                } else if (CONFIG.ttsFallbackToText) {
                    textToShow = aiReplyText || '';
                }

                // 如果TTS彻底失败且无本地兜底，显示文字
                if (!finalAudio && CONFIG.ttsFallbackToText && !textToShow) {
                    textToShow = aiReplyText || '';
                }
                // 如果有兜底文字但没音频，也可以直接推文字（不强制带图片）
                const image = mediaAttach ? mediaAttach.image : null;

                if (image || finalAudio || textToShow) {
                    addComboMessageTTS(textToShow, image, finalAudio, finalAudioDuration, aiReplyText);
                }

            } else {
                // --- 纯语音：只推音频气泡，失败则显示文字 ---
                if (ttsResult) {
                    addMediaMessage('audio', ttsResult.audioUrl, { duration: ttsResult.duration, ttsText: aiReplyText });
                } else {
                    // TTS失败：先用本地音频兜底，同时把文字显示出来（按你要求）
                    if (mediaAttach && mediaAttach.fallbackPath) {
                        addMediaMessage('audio', mediaAttach.fallbackPath, { ttsText: aiReplyText });
                    }
                    if (CONFIG.ttsFallbackToText && aiReplyText) {
                        addMessage(aiReplyText, 'bot');
                    } else if (!mediaAttach || !mediaAttach.fallbackPath) {
                        // 连本地兜底都没有，至少显示一条系统提示
                        showSystemMessage('🔇 语音合成暂时不可用');
                    }
                }
            }
        }

        /**
         * combo消息的TTS版本：可选文字+可选图片+可选音频，音频优先TTS；会把原始AI文本存入history便于上下文
         */
        function addComboMessageTTS(text, imagePath, audioPath, audioDuration, rawAIReply) {
            const history = getHistory();
            const storedText = rawAIReply || text || '[多媒体消息]';
            const msg = {
                role: 'assistant',
                type: 'combo',
                text: text || '',
                image: imagePath || null,
                audio: audioPath || null,
                audioDuration: audioPath ? (audioDuration || getMockDuration()) : null,
                content: storedText,   // 给上下文用
                ttsText: rawAIReply || null,
                time: getTime(),
                timestamp: getFullTimestamp()
            };
            history.push(msg);
            saveHistory(history);
            renderMessages();
        }

        // ============================================================
        //  发送入口
        // ============================================================
        function handleSend() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showSystemMessage('⚠️ 请先配置 DeepSeek API Key');
                return;
            }
            const text = userInput.value.trim();
            if (!text || isWaiting || !currentPersona) return;

            // 位置查询优先
            const locationResult = handleLocationQueryText(text);
            if (locationResult) {
                addMessage(text, 'user');
                userInput.value = '';
                userInput.style.height = '48px';
                addMessage(locationResult, 'bot');
                return;
            }

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '48px';

            const mediaResult = handleKeywordTrigger(text);
            if (mediaResult) {
                // ===== 需要走 TTS 流程（语音关键词 / 组合词）=====
                if (mediaResult.needTTS) {
                    const mediaAttach = {
                        type: mediaResult.type,  // 'combo' 或 'audio'
                        image: mediaResult.image || null,
                        fallbackAudio: mediaResult.fallbackAudio || null,
                        fallbackPath: mediaResult.fallbackPath || null
                    };
                    // 异步走：AI生成文字 → 转TTS → 推气泡（失败→文字/本地音频兜底）
                    callDeepSeek(text, { ttsMode: true, mediaAttach });
                    return;
                }

                // ===== 纯图片，不涉及TTS =====
                if (mediaResult.type === 'combo') {
                    addComboMessage(mediaResult.text, mediaResult.image, mediaResult.audio);
                } else if (mediaResult.type === 'image') {
                    addMediaMessage('image', mediaResult.path);
                } else if (mediaResult.type === 'audio') {
                    addMediaMessage('audio', mediaResult.path);
                }
                return;
            }

            callDeepSeek(text);
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        sendBtn.onclick = handleSend;
        userInput.onkeydown = e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                handleSend(); }
        };
        userInput.oninput = function() {
            this.style.height = '48px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        };

        // ===== 配置面板折叠 =====
        apiPanelToggle.addEventListener('click', () => {
            apiPanel.classList.toggle('open');
        });

        apiKeyInput.onchange = function() {
            const val = this.value.trim();
            if (val) {
                localStorage.setItem('ai_api_key', val);
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'status ready';
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                localStorage.removeItem('ai_api_key');
                apiStatus.textContent = '❌ 未配置';
                apiStatus.className = 'status';
                userInput.disabled = true;
                sendBtn.disabled = true;
            }
            updateKeyStatusDots();
        };
        apiKeyInput.oninput = updateKeyStatusDots;

        // ===== TTS Key =====
        ttsKeyInput.onchange = function() {
            const val = this.value.trim();
            if (val) {
                localStorage.setItem('ai_tts_api_key', val);
                ttsApiKey = val;
                ttsStatus.textContent = '✅ 已配置';
                ttsStatus.className = 'status ready';
            } else {
                localStorage.removeItem('ai_tts_api_key');
                ttsApiKey = '';
                ttsStatus.textContent = '❌ 未配置';
                ttsStatus.className = 'status';
            }
            updateKeyStatusDots();
        };
        ttsKeyInput.oninput = updateKeyStatusDots;

        // ===== 每个角色声音独立保存 =====
        voiceTianxiaoduo.onchange = function() {
            localStorage.setItem('ai_tts_voice_tianxiaoduo', this.value);
            CONFIG.ttsVoiceTianxiaoduo = this.value;
        };
        voiceBaijie.onchange = function() {
            localStorage.setItem('ai_tts_voice_baijie', this.value);
            CONFIG.ttsVoiceBaijie = this.value;
        };
        voiceXiaoya.onchange = function() {
            localStorage.setItem('ai_tts_voice_xiaoya', this.value);
            CONFIG.ttsVoiceXiaoya = this.value;
        };
        ttsModelSelect.onchange = function() {
            localStorage.setItem('ai_tts_model', this.value);
            CONFIG.ttsModel = this.value;
        };

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            await loadData();

            if (!PERSONAS || PERSONAS.length === 0) {
                console.error('加载人物数据失败');
                return;
            }

            // 初始化 conversations
            PERSONAS.forEach(p => {
                const key = 'chat_' + p.id;
                const saved = JSON.parse(localStorage.getItem(key) || '[]');
                const fixed = saved.map(msg => {
                    if (msg.role === 'bot') msg.role = 'assistant';
                    return msg;
                });
                // 使用角色自己的 maxHistory 进行初始截断
                const maxHistory = p.maxHistory !== undefined ? p.maxHistory : 60;
                conversations[p.id] = fixed.slice(-maxHistory);
            });

            currentPersona = PERSONAS[0];

            // ===== 恢复 DeepSeek Key =====
            if (apiKey) {
                apiKeyInput.value = apiKey;
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'status ready';
                userInput.disabled = false;
                sendBtn.disabled = false;
            }

            // ===== 恢复 TTS Key + 各角色声音 + 模型 =====
            if (ttsApiKey) {
                ttsKeyInput.value = ttsApiKey;
                ttsStatus.textContent = '✅ 已配置';
                ttsStatus.className = 'status ready';
            }
            const savedVoiceTXD = localStorage.getItem('ai_tts_voice_tianxiaoduo');
            if (savedVoiceTXD) {
                voiceTianxiaoduo.value = savedVoiceTXD;
                CONFIG.ttsVoiceTianxiaoduo = savedVoiceTXD;
            }
            const savedVoiceBJ = localStorage.getItem('ai_tts_voice_baijie');
            if (savedVoiceBJ) {
                voiceBaijie.value = savedVoiceBJ;
                CONFIG.ttsVoiceBaijie = savedVoiceBJ;
            }
            const savedVoiceXY = localStorage.getItem('ai_tts_voice_xiaoya');
            if (savedVoiceXY) {
                voiceXiaoya.value = savedVoiceXY;
                CONFIG.ttsVoiceXiaoya = savedVoiceXY;
            }
            const savedModel = localStorage.getItem('ai_tts_model');
            if (savedModel) {
                ttsModelSelect.value = savedModel;
                CONFIG.ttsModel = savedModel;
            }
            updateKeyStatusDots();

            renderPersonas();
            updateHeader();
            renderMessages();

            setInterval(() => updateStatusTag(), 60000);

            console.log('💕 AI女友已启动 (角色独立参数版 + 百炼TTS集成)');
            console.log('📊 当前角色:', currentPersona.name, '| 声音:', getCurrentVoice());
            console.log('📝 各角色参数独立配置｜各角色声音独立保存');
            console.log('🔐 配置密码已设置');
            console.log('📱 点击顶部 ⚙️ API配置 展开面板｜设置 DeepSeek Key + 百炼TTS Key');
        }

        // 启动
        init();
    </script>

</body>
</html>
