<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 女友</title>
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #edf2f7;
        }
        .app {
            max-width: 480px;
            width: 100%;
            height: 94vh;
            max-height: 780px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #141a24;
            position: relative;
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b3a50;
            border-radius: 8px;
        }

        /* ===== 头部 ===== */
        .header {
            padding: 14px 16px 10px 16px;
            border-bottom: 1px solid #2a3344;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: #0f161e;
            flex-wrap: wrap;
        }
        .header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #2b5ca8;
        }
        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header .info {
            flex: 1;
            min-width: 80px;
        }
        .header .info .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .info .name-row h1 {
            font-size: 17px;
            font-weight: 600;
            color: #edf2f7;
        }
        .header .info .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #7a8aa3;
            flex-wrap: wrap;
        }
        .header .info .status-row .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 2px;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .header .info .status-row .status-tag {
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid #2a3344;
            background: #1a2538;
            color: #8899bb;
            white-space: nowrap;
        }
        .status-tag.working {
            color: #4fc3f7;
            border-color: #2b5ca8;
        }
        .status-tag.resting {
            color: #ffb74d;
            border-color: #8d6e3f;
        }
        .status-tag.sleeping {
            color: #7986cb;
            border-color: #3949ab;
        }
        .status-tag.free {
            color: #81c784;
            border-color: #388e3c;
        }
        .status-tag.singing {
            color: #ff8a65;
            border-color: #d84315;
        }

        /* ===== 三点菜单 ===== */
        .menu-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #7a8aa3;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            line-height: 1;
            transition: 0.2s;
            letter-spacing: 2px;
        }
        .menu-btn:hover {
            background: #1e283a;
            color: #edf2f7;
        }
        .menu-dropdown {
            position: absolute;
            right: 0;
            top: 36px;
            background: #1a2538;
            border: 1px solid #2a3344;
            border-radius: 12px;
            padding: 6px 0;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 100;
            overflow: hidden;
        }
        .menu-dropdown.open {
            display: block;
        }
        .menu-dropdown .item {
            padding: 10px 16px;
            font-size: 13px;
            color: #a0b3cc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .menu-dropdown .item:hover {
            background: #2a3344;
            color: #edf2f7;
        }
        .menu-dropdown .item.danger {
            color: #cf6679;
        }
        .menu-dropdown .item.danger:hover {
            background: #2a1418;
            color: #ff8a9e;
        }
        .menu-dropdown .divider {
            height: 1px;
            background: #2a3344;
            margin: 4px 12px;
        }

        /* ===== 角色切换栏 ===== */
        .persona-bar {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
            background: #0c131c;
            border-bottom: 1px solid #1a2330;
        }
        .persona-bar::-webkit-scrollbar {
            display: none;
        }
        .persona-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 70px;
            border: 2px solid transparent;
            background: transparent;
        }
        .persona-item.active {
            border-color: #2b5ca8;
            background: #1a2538;
        }
        .persona-item .pavatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2f3b4e;
        }
        .persona-item.active .pavatar {
            border-color: #3a7bd5;
        }
        .persona-item .pname {
            font-size: 12px;
            color: #edf2f7;
            white-space: nowrap;
        }
        .persona-item.active .pname {
            color: #edf2f7;
            font-weight: 600;
        }

        /* ===== API 配置折叠面板 ===== */
        .api-panel {
            flex-shrink: 0;
            background: #0c131c;
            border-bottom: 1px solid #1a2330;
        }
        .api-panel-header {
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .api-panel-header:hover {
            background: #101a26;
        }
        .api-panel-header .toggle-icon {
            font-size: 8px;
            color: #5b6e8a;
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }
        .api-panel.open .api-panel-header .toggle-icon {
            color: #3a7bd5;
        }
        .api-panel-header .title {
            font-size: 12px;
            color: #7a8aa3;
            flex: 1;
        }
        .api-panel-header .stat-dots {
            display: flex;
            gap: 6px;
            font-size: 11px;
        }
        .api-panel-header .stat-dots .dot-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .api-panel-header .stat-dots .ok { color: #4caf50; }
        .api-panel-header .stat-dots .no { color: #7a8aa3; }

        .api-panel-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s;
            padding: 0 16px;
        }
        .api-panel.open .api-panel-body {
            max-height: 1000px;
            padding: 4px 16px 12px 16px;
        }

        .api-section-title {
            font-size: 11px;
            color: #5b6e8a;
            margin: 10px 0 6px;
            padding-left: 2px;
            border-left: 2px solid #3a7bd5;
            padding-left: 6px;
        }
        .api-row {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .api-row label {
            font-size: 12px;
            color: #7a8aa3;
            min-width: 68px;
        }
        .api-row input,
        .api-row select {
            flex: 1;
            min-width: 120px;
            padding: 6px 12px;
            border-radius: 18px;
            border: 1px solid #2f3b4e;
            background: #1a2533;
            color: #edf2f7;
            font-size: 13px;
            font-family: inherit;
        }
        .api-row input:focus,
        .api-row select:focus {
            outline: none;
            border-color: #3a7bd5;
        }
        .api-row input::placeholder {
            color: #4d627c;
        }
        .api-row .status {
            font-size: 11px;
            color: #4d627c;
            min-width: 56px;
        }
        .api-row .status.ready {
            color: #4caf50;
        }
        .api-row .test-btn {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 14px;
            background: #2a3e5c;
            color: #cfe0ff;
            border: none;
            cursor: pointer;
        }
        .api-row .test-btn:hover { background: #355078; }
        .api-row .test-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== 消息区 ===== */
        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #10171f;
            min-height: 0;
        }

        /* ===== 消息气泡 ===== */
        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.25s ease-out;
            word-break: break-word;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.bot {
            align-self: flex-start;
            background: #1e283a;
            color: #e2e8f0;
            border-bottom-left-radius: 6px;
            border: 1px solid #2b354a;
        }
        .message.user {
            align-self: flex-end;
            background: #2b5ca8;
            color: white;
            border-bottom-right-radius: 6px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
        }
        .message.sys {
            font-size: 12px;
            color: #5b6e8a;
            text-align: center;
            align-self: center;
            background: transparent !important;
            border: none !important;
            padding: 4px 0 !important;
        }
        .message.bot .msg-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            display: block;
            margin-top: 4px;
            border: 1px solid #2b354a;
        }

        /* ===== 音频 ===== */
        .audio-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            max-width: 220px;
            padding: 2px 0;
            cursor: pointer;
            user-select: none;
        }
        .audio-play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #3a7bd5;
            color: white;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
            line-height: 1;
        }
        .audio-play-btn:hover {
            background: #4f8ee8;
        }
        .audio-play-btn.playing {
            background: #e85a4f;
        }
        .audio-wave {
            flex: 1;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 2px;
            min-width: 60px;
            position: relative;
        }
        .audio-wave .bar {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #3a4a5e;
            transition: height 0.15s, background 0.3s;
            min-height: 3px;
            max-height: 22px;
        }
        .audio-wave .bar.active {
            background: #3a7bd5;
        }
        .audio-wave .bar.played {
            background: #3a7bd5;
            opacity: 0.6;
        }
        .audio-duration {
            font-size: 12px;
            color: #8899bb;
            flex-shrink: 0;
            min-width: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
        }

        /* ===== 输入区 ===== */
        .input-area {
            padding: 8px 16px 14px 16px;
            border-top: 1px solid #1f2a38;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: flex-end;
            background: #0f161e;
        }
        .input-area textarea {
            flex: 1;
            background: #1a2533;
            border: 1px solid #2f3b4e;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 15px;
            color: #edf2f7;
            resize: none;
            height: 48px;
            max-height: 100px;
            font-family: inherit;
            line-height: 1.5;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #3a7bd5;
        }
        .input-area textarea::placeholder {
            color: #4d627c;
        }
        .input-area textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .input-area button {
            background: #2b5ca8;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:hover:not(:disabled) {
            background: #3a7bd5;
        }
        .input-area button:active:not(:disabled) {
            transform: scale(0.92);
        }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 遮罩 ===== */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            border-radius: 32px;
            backdrop-filter: blur(2px);
        }
        .overlay.open {
            display: flex;
        }

        /* ===== 通用弹窗 ===== */
        .modal {
            background: #1a2538;
            border: 1px solid #2a3344;
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .modal .modal-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }
        .modal h2 {
            font-size: 18px;
            font-weight: 600;
            color: #edf2f7;
            margin-bottom: 6px;
        }
        .modal p {
            font-size: 14px;
            color: #a0b3cc;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .modal .file-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #10171f;
            border: 1px solid #2a3344;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 12px;
            text-align: left;
        }
        .modal .file-input-row label {
            background: #2b5ca8;
            color: white;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .modal .file-input-row label:hover {
            background: #3a7bd5;
        }
        .modal .file-input-row input[type="file"] {
            display: none;
        }
        .modal .file-input-row .file-name {
            font-size: 13px;
            color: #8899bb;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }
        .modal .modal-actions button {
            padding: 8px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 500;
        }
        .modal .modal-actions .btn-cancel {
            background: #2f3b4e;
            color: #a0b3cc;
        }
        .modal .modal-actions .btn-cancel:hover {
            background: #3a4a62;
            color: #edf2f7;
        }
        .modal .modal-actions .btn-confirm {
            background: #3a7bd5;
            color: white;
        }
        .modal .modal-actions .btn-confirm:hover {
            background: #4f8ee8;
        }
        .modal .modal-actions .btn-danger {
            background: #cf6679;
            color: white;
        }
        .modal .modal-actions .btn-danger:hover {
            background: #e5738a;
        }

        .modal .pwd-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #2a3344;
            border-radius: 10px;
            background: #10171f;
            color: #edf2f7;
            font-size: 16px;
            font-family: inherit;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 4px;
        }
        .modal .pwd-input:focus {
            outline: none;
            border-color: #3a7bd5;
        }
        .modal .pwd-input::placeholder {
            color: #4d627c;
            letter-spacing: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
            .overlay {
                border-radius: 0;
            }
            .modal {
                max-width: 92%;
                padding: 24px 18px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== 遮罩 + 弹窗容器 ===== -->
        <div class="overlay" id="overlay">
            <div class="modal" id="modalContent">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="avatar" id="headerAvatar">
                <img id="headerAvatarImg" src="/img/tianxiaoduo/avatar/avatar.jpg" alt="avatar">
            </div>
            <div class="info">
                <div class="name-row">
                    <h1 id="headerName">甜小朵</h1>
                </div>
                <div class="status-row">
                    <span class="dot"></span>
                    <span>在线</span>
                    <span class="status-tag" id="statusTag">💉 上班中</span>
                </div>
            </div>
            <div class="menu-wrapper">
                <button class="menu-btn" id="menuBtn" aria-label="菜单">···</button>
                <div class="menu-dropdown" id="menuDropdown">
                    <button class="item" data-action="import">📥 导入聊天记录</button>
                    <button class="item" data-action="export">📤 导出聊天记录</button>
                    <div class="divider"></div>
                    <button class="item" data-action="show">📖 Girls3</button>
                    <button class="item" data-action="world">🗺️ 世界观</button>
                    <div class="divider"></div>
                    <button class="item danger" data-action="clear">🗑️ 清空所有消息</button>
                </div>
            </div>
        </div>

        <!-- ===== 角色切换栏 ===== -->
        <div class="persona-bar" id="personaBar"></div>

        <!-- ===== API 配置折叠面板 ===== -->
        <div class="api-panel" id="apiPanel">
            <div class="api-panel-header" id="apiPanelToggle">
                <span class="toggle-icon">●</span>
                <span class="title">⚙️ API 配置 & 语音设置</span>
                <div class="stat-dots">
                    <span class="dot-item"><span id="dsDot" class="no">●</span>文字</span>
                    <span class="dot-item"><span id="ttsDot" class="no">●</span>语音</span>
                </div>
            </div>
            <div class="api-panel-body">
                <div class="api-section-title">🧠 文字对话 (DeepSeek)</div>
                <div class="api-row">
                    <label>API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxx...">
                    <span class="status" id="apiStatus">未配置</span>
                </div>

                <div class="api-section-title">🎙️ 语音合成 (阿里云百炼)</div>
                <div class="api-row">
                    <label>API Key</label>
                    <input type="password" id="ttsKeyInput" placeholder="sk-xxxxxxxx...">
                    <span class="status" id="ttsStatus">未配置</span>
                </div>
                <div class="api-row">
                    <label>甜小朵声音</label>
                    <select id="voiceTianxiaoduo">
                        <option value="Cherry">Cherry（温柔女声·推荐）</option>
                        <option value="Serena">Serena（知性女声）</option>
                        <option value="Luna">Luna（活泼少女）</option>
                        <option value="Katherine">Katherine（甜美女声）</option>
                        <option value="longanhuan_v3.6">longanhuan_v3.6（安远女声）</option>
                    </select>
                </div>
                <div class="api-row">
                    <label>白洁声音</label>
                    <select id="voiceBaijie">
                        <option value="Serena">Serena（知性女声·推荐）</option>
                        <option value="Cherry">Cherry（温柔女声）</option>
                        <option value="Luna">Luna（活泼少女）</option>
                        <option value="Katherine">Katherine（甜美女声）</option>
                        <option value="longanyang">longanyang（安洋男声-可选）</option>
                    </select>
                </div>
                <div class="api-row">
                    <label>小雅声音</label>
                    <select id="voiceXiaoya">
                        <option value="Luna">Luna（活泼少女·推荐）</option>
                        <option value="Cherry">Cherry（温柔女声）</option>

            // 母亲节：5月第2个周日；父亲节：6月第3个周日；感恩节：11月第4个周四

        // ============================================================
        //  农历节日（2024-2030 对应公历日期表，准确值）

        //      七夕节(七月初七)、中秋节(八月十五)、重阳节(九月初九)
        // ============================================================
        const LUNAR_HOLIDAYS = {
            2024: { '春节': '02-10', '元宵节': '02-24', '端午节': '06-10', '七夕节': '08-10', '中秋节': '09-17', '重阳节': '10-11' },
            2025: { '春节': '01-29', '元宵节': '02-12', '端午节': '05-31', '七夕节': '08-29', '中秋节': '10-06', '重阳节': '10-29' },
            2026: { '春节': '02-17', '元宵节': '03-03', '端午节': '06-19', '七夕节': '08-19', '中秋节': '09-25', '重阳节': '10-18' },
            2027: { '春节': '02-06', '元宵节': '02-20', '端午节': '06-09', '七夕节': '08-08', '中秋节': '09-15', '重阳节': '10-08' },
            2028: { '春节': '01-26', '元宵节': '02-09', '端午节': '05-28', '七夕节': '08-27', '中秋节': '10-03', '重阳节': '10-26' },
            2029: { '春节': '02-13', '元宵节': '02-27', '端午节': '06-16', '七夕节': '08-16', '中秋节': '09-22', '重阳节': '10-15' },
            2030: { '春节': '02-03', '元宵节': '02-17', '端午节': '06-05', '七夕节': '08-05', '中秋节': '09-12', '重阳节': '10-05' }
        };

        // 24节气中当作"节日问候"的节气（清明/冬至/立春/立夏/立秋/立冬 这6个重要节气）
        const TERMS_AS_HOLIDAY = new Set(['清明', '冬至', '立春', '立夏', '立秋', '立冬']);

        // ============================================================
        //  获取某一年完整的节日映射表
        //  返回格式：{ 'MM-DD': ['节日名1', '节日名2'] }
        // ============================================================
        function buildYearHolidayMap(year) {
            const map = {};
            const addHoliday = (dateKey, name) => {
                if (!map[dateKey]) map[dateKey] = [];
                if (!map[dateKey].includes(name)) map[dateKey].push(name);
            };

            // 1) 固定公历节日
            for (const [k, v] of Object.entries(HOLIDAYS_FIXED)) addHoliday(k, v);

            // 2) 农历节日（查表）
            const lunar = LUNAR_HOLIDAYS[year] || LUNAR_HOLIDAYS[2026];
            for (const [name, dateKey] of Object.entries(lunar)) addHoliday(dateKey, name);

            // 3) 节气类节日（立春/清明/立夏/立秋/立冬/冬至）
            for (const [dateKey, termName] of Object.entries(SOLAR_TERMS)) {
                if (TERMS_AS_HOLIDAY.has(termName)) addHoliday(dateKey, termName + '节气');
            }

            // 4) 动态节日（母亲节/父亲节/感恩节）
            //    母亲节：5月第二个周日
            const secondSunMay = nthWeekdayOf(year, 5, 0, 2);
            if (secondSunMay) addHoliday(toDateKey(secondSunMay), '母亲节');
            //    父亲节：6月第三个周日
            const thirdSunJun = nthWeekdayOf(year, 6, 0, 3);
            if (thirdSunJun) addHoliday(toDateKey(thirdSunJun), '父亲节');
            //    感恩节：11月第四个周四
            const fourthThuNov = nthWeekdayOf(year, 11, 4, 4);
            if (fourthThuNov) addHoliday(toDateKey(fourthThuNov), '感恩节');

            // 5) 用户生日（农历10月26 → 每年查表得公历）
            try {
                const bdKey = getUserBirthday(year);
                if (bdKey) addHoliday(bdKey, USER_BIRTHDAY_NAME || '男朋友生日');
            } catch (e) { /* getUserBirthday 还没定义时忽略（定义顺序） */ }

            return map;
        }

        // 工具：返回第n个星期X的日期（month 1-12, weekday 0=周日..6=周六, nth 1..5）
        function nthWeekdayOf(year, month, weekday, nth) {
            const first = new Date(year, month - 1, 1);
            let daysToFirst = (weekday - first.getDay() + 7) % 7;
            let day = 1 + daysToFirst + (nth - 1) * 7;
            const d = new Date(year, month - 1, day);
            if (d.getMonth() !== month - 1) return null;
            return d;
        }
        function toDateKey(d) {
            return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function getDateStr(dateOrNow) {
            const d = dateOrNow || new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        // ============================================================
        //  数据加载（从 data.json）
        // ============================================================
        let PERSONAS = [];
        let CITY_DATA = null;
        let appReady = false;

        async function loadData() {
            try {
                const resp = await fetch('data.json');
                const data = await resp.json();
                CITY_DATA = data;
                PERSONAS = data.personas;
                return data;
            } catch (e) {
                console.error('加载 data.json 失败:', e);
                return null;
            }
        }

        // ============================================================
        //  获取当前角色的参数（带后备默认值）
        // ============================================================
        function getPersonaParam(paramName, defaultValue) {
            if (currentPersona && currentPersona[paramName] !== undefined) {
                return currentPersona[paramName];
            }
            return defaultValue;
        }

        function getMediaProb() { return getPersonaParam('mediaProb', 0.8); }
        function getNakedProb() { return getPersonaParam('nakedProb', 0.3); }
        function getMaxTokens() { return getPersonaParam('maxTokens', 400); }
        function getMaxHistory() { return getPersonaParam('maxHistory', 60); }
        function getMaxFileNum() { return getPersonaParam('maxFileNum', 30); }
        function getMaxNakedNum() { return getPersonaParam('maxNakedNum', 15); }
        function getMaxAudioNum() { return getPersonaParam('maxAudioNum', 30); }

        // ============================================================
        //  位置查询功能
        // ============================================================
        const LOCATION_KEYWORDS = ['在哪', '在哪里', '位置', '地址', '怎么走', '在哪儿', '附近'];

        function isLocationQuery(text) {
            return LOCATION_KEYWORDS.some(kw => text.includes(kw));
        }

        function findLocation(text, landmarks, personas) {
            for (const item of landmarks) {
                if (text.includes(item.name)) {
                    return {
                        found: true,
                        name: item.name,
                        type: '地标',
                        district: item.district,
                        address: item.address,
                        full: `${item.name}位于${item.district}${item.address}`
                    };
                }
            }
            for (const p of personas) {
                if (text.includes(p.name)) {
                    return {
                        found: true,
                        name: p.name,
                        type: '角色',
                        district: p.district,
                        address: p.address,
                        workAddr: p.workAddr,
                        work: p.workplace,
                        full: `${p.name}住在${p.district}${p.address}，在${p.district}${p.workAddr}的${p.work}工作`
                    };
                }
                if (text.includes(p.workplace)) {
                    return {
                        found: true,
                        name: p.workplace,
                        type: '工作地点',
                        district: p.district,
                        address: p.workAddr,
                        full: `${p.workplace}位于${p.district}${p.workAddr}`
                    };
                }
            }
            return { found: false };
        }

        function handleLocationQuery(userText, landmarks, personas) {
            const result = findLocation(userText, landmarks, personas);
            if (!result.found) {
                for (const item of landmarks) {
                    if (userText.includes(item.name.substring(0, 2))) {
                        return `你是问「${item.name}」吗？它在${item.district}${item.address}`;
                    }
                }
                return null;
            }
            return result.full;
        }

        // ============================================================
        //  年龄计算函数
        // ============================================================
        function calculateAge(birthday) {
            const today = new Date();
            const birth = new Date(birthday);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
                age--;
            }
            return age;
        }

        // ============================================================
        //  DOM
        // ============================================================
        const personaBar = document.getElementById('personaBar');
        const headerAvatarImg = document.getElementById('headerAvatarImg');
        const headerName = document.getElementById('headerName');

        // ============================================================

        let currentPersona = null;

        const WEATHER_CACHE_DURATION = 30 * 60 * 1000;

        // ============================================================
        //  工具函数
        // ============================================================
        function getTime() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function getFullTimestamp() {
            return new Date().toISOString();
        }

        function getDateStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return y + m + day;
        }

        function getHistory() {
            return currentPersona ? conversations[currentPersona.id] || [] : [];
        }

        function saveHistory(history) {
            if (!currentPersona) return;
            const maxHistory = getMaxHistory();
            const trimmed = history.slice(-maxHistory);
            conversations[currentPersona.id] = trimmed;
            localStorage.setItem('chat_' + currentPersona.id, JSON.stringify(trimmed));
        }

        function getRandomImagePath(isNaked = false) {
            if (!currentPersona) return '';
            const maxNum = isNaked ? getMaxNakedNum() : getMaxFileNum();
            const num = Math.floor(Math.random() * maxNum) + 1;
            if (isNaked) {
                return `/img/${currentPersona.id}/naked/${num}.jpg`;
            }
            return `/img/${currentPersona.id}/${num}.jpg`;
        }

        function getRandomAudioPath() {
            if (!currentPersona) return '';
            const maxNum = getMaxAudioNum();
            const num = Math.floor(Math.random() * maxNum) + 1;
            return `/audio/${currentPersona.id}/${num}.mp3`;
        }

        function getMockDuration() {
            return Math.floor(Math.random() * 9) + 3;
        }

        function isImagePath(text) {
            return text && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(text);
        }

        function isAudioPath(text) {
            return text && /\.(mp3|wav|m4a|flac|aac|ogg)$/i.test(text);
        }

        // ============================================================
        //  时间信息
        // ============================================================
        function getTimeInfo() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const hour = now.getHours();
            const minute = now.getMinutes();
            const second = now.getSeconds();
            const weekday = now.getDay();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dateKey = String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            const seasons = [
                { name: '春', months: [3, 4, 5] },
                { name: '夏', months: [6, 7, 8] },
                { name: '秋', months: [9, 10, 11] },
                { name: '冬', months: [12, 1, 2] }
            ];
            const season = seasons.find(s => s.months.includes(month))?.name || '冬';
            const ampm = hour < 12 ? '上午' : '下午';
            const term = SOLAR_TERMS[dateKey] || null;
            // ===== 用新的全年节日表取今天所有节日 =====
            const yearMap = buildYearHolidayMap(year);
            // holidaysToday: 数组（可能多个节日同一天），或者 null
            let holidaysToday = (yearMap[dateKey] && yearMap[dateKey].length) ? [...yearMap[dateKey]] : null;
            // ===== 标记：今天是不是用户生日 =====
            const isUserBirthday = !!(holidaysToday && holidaysToday.includes(USER_BIRTHDAY_NAME));
            // （男朋友生日这个条目放在最前面）
            if (isUserBirthday) {
                holidaysToday = [USER_BIRTHDAY_NAME, ...holidaysToday.filter(n => n !== USER_BIRTHDAY_NAME)];
            }
            const holiday = holidaysToday ? holidaysToday.join('、') : null;
            return {
                now,
                year,
                month,
                day,
                hour,
                minute,
                second,
                weekday: weekdays[weekday],
                ampm,
                dateKey,
                season,
                term,
                holiday,                 // 字符串（多个用顿号）兼容旧逻辑
                holidaysToday,           // 数组，新逻辑用
                isUserBirthday,          // 男朋友生日专属标记
                isWeekend: weekday === 0 || weekday === 6
            };
        }

        // ============================================================
        //  今天第一轮聊天检测（每个角色每天一个标记）
        //  返回 { firstTime: true/false, key: '存储用的key' }
        // ============================================================
        function checkDailyFirst(personaId, now) {
            const todayStr = getDateStr(now);          // YYYY-MM-DD
            const key = `daily_greet_${todayStr}_${personaId}`;
            const firstTime = !localStorage.getItem(key);
            return { firstTime, key };
        }
        function markDailyDone(key) {
            try { localStorage.setItem(key, '1'); } catch (e) {}
        }

        // ============================================================
        //  状态标签
        // ============================================================
        function getStatusTag(now, personaId) {
            const h = now.getHours();
            const m = now.getMinutes();
            const day = now.getDate();
            const weekday = now.getDay();
            const total = h * 60 + m;

            // ============================================================
            //  7天周期循环工具（用于甜小朵大夜班：每7天1个大夜班≈每月4-5天）
            // ============================================================
            const BASE_DATE = new Date(2026, 0, 1); // 2026-01-01 作为基准
            const diffDays = Math.floor((now.getTime() - BASE_DATE.getTime()) / (1000 * 60 * 60 * 24));
            const mod7 = ((diffDays % 7) + 7) % 7; // 0 ~ 6
            // 余数 = 0 → 大夜班日（每7天1天≈每月4-5天，符合B方案）
            const isTXDBigNight = (mod7 === 0) && (personaId === 'tianxiaoduo');

            if (personaId === 'tianxiaoduo') {
                // ============= 大夜班日（优先级最高，不管周几）=============
                if (isTXDBigNight) {
                    // 20:00 ~ 次日 08:00 通宵值班（儿科病房不关门）
                    if (total >= 20 * 60 || total < 8 * 60) return { icon: '🌙', label: '大夜班中', cls: 'working' };
                    // 08:00 ~ 20:00 补觉（刚下夜班回家睡觉）
                    return { icon: '😴', label: '补觉中', cls: 'sleeping' };
                }

                // ============= 非大夜班日：周日休息 ============
                const isSunday = weekday === 0;
                if (isSunday) {
                    if (total >= 23 * 60 || total < 8 * 60) return { icon: '🌙', label: '已休息', cls: 'sleeping' };
                    return { icon: '☕', label: '休息日', cls: 'free' };
                }

                // ============= 非大夜班+非周日：正常护士白班 ============
                if (total >= 22 * 60 + 30 || total < 6 * 60) return { icon: '🌙', label: '已休息', cls: 'sleeping' };
                if (total < 11 * 60 + 30) return { icon: '💉', label: '上班中', cls: 'working' };
                if (total < 13 * 60 + 30) return { icon: '🍜', label: '午休中', cls: 'resting' };
                if (total < 17 * 60) return { icon: '💉', label: '上班中', cls: 'working' };
                return { icon: '🏠', label: '已下班', cls: 'free' };
            }

            if (personaId === 'baijie') {
                const isFirstHalf = day <= 15;
                const isSunday = weekday === 0;

                // ========== 周日：休息日（不管上下半月）==========
                if (isSunday) {
                    // 23:00~9:00 睡觉，其余休息（含睡前红酒/SPA，0-3点也醒——因为是休息日熬夜一下合理）
                    if (total >= 3 * 60 && total < 9 * 60) return { icon: '🌙', label: '已休息', cls: 'sleeping' };
                    return { icon: '☕', label: '周日休息', cls: 'free' };
                }

                if (isFirstHalf) {
                    // ===== 上半月：夜班（行政酒廊/VIP应酬，工作到凌晨5点）=====
                    if (total >= 5 * 60 && total < 11 * 60) return { icon: '😴', label: '补觉中', cls: 'sleeping' };
                    if (total >= 20 * 60 || total < 5 * 60) return { icon: '🌙', label: '夜班中', cls: 'working' };
                    return { icon: '🏠', label: '自由活动', cls: 'free' };
                } else {
                    // ===== 下半月：白班（客户关系总监·0-3点夜生活/客户微信/红酒SPA）=====
                    if (total >= 3 * 60 && total < 9 * 60) return { icon: '🌙', label: '已休息', cls: 'sleeping' };
                    if (total < 10 * 60) return { icon: '🪥', label: '刚起床', cls: 'free' };
                    if (total < 18 * 60) return { icon: '💼', label: '上班中', cls: 'working' };
                    // 18点~次日3点：自由活动+红酒/SPA/客户线上维系
                    return { icon: '🏠', label: '已下班', cls: 'free' };
                }
            }

            if (personaId === 'xiaoya') {
                const isTue = weekday === 2;
                const isFri = weekday === 5;
                const isWed = weekday === 3;
                const isSat = weekday === 6;
                const isRest = isWed || isSat;        // 周三/周六休息日
                const isSing = isTue || isFri;        // 周二/周五驻唱日

                if (isRest) {
                    // ===== 周三/周六休息日：文艺青年熬夜画插画到3点 =====
                    if (total >= 3 * 60 && total < 8 * 60) return { icon: '🌙', label: '已休息', cls: 'sleeping' };
                    // 0~3点：熬夜画画；8点以后：咖啡馆/绿道/唱片店
                    return { icon: '☕', label: '休息日', cls: 'free' };
                }
                if (isSing) {
                    // ===== 周二/周五驻唱日：驻唱收尾到凌晨5点，之后补觉 =====
                    if (total >= 5 * 60 && total < 12 * 60) return { icon: '😴', label: '补觉中', cls: 'sleeping' };
                    if (total < 19 * 60) return { icon: '📚', label: '上班中', cls: 'working' };   // 12-19点书店下午班
                    if (total >= 21 * 60 || total < 5 * 60) return { icon: '🎤', label: '驻唱中', cls: 'singing' }; // 21点后~5点前都算驻唱/收尾
                    return { icon: '🏠', label: '驻唱准备', cls: 'free' };   // 19-21点换衣服/赶路
                }
                // ===== 普通工作日（一/四/日）=====
                if (total >= 22 * 60 || total < 7 * 60) return { icon: '🌙', label: '已休息', cls: 'sleeping' };
                if (total < 11 * 60) return { icon: '📚', label: '上班中', cls: 'working' };
                if (total < 14 * 60) return { icon: '🍜', label: '午休中', cls: 'resting' };
                if (total < 17 * 60) return { icon: '📚', label: '上班中', cls: 'working' };
                if (total < 22 * 60) return { icon: '🏠', label: '已下班', cls: 'free' };
                return { icon: '🌙', label: '已休息', cls: 'sleeping' };
            }
            return { icon: '💬', label: '在线', cls: 'free' };
        }

        // ============================================================
        //  判断默认回复
        // ============================================================
        function shouldDefaultReply(personaId, now) {
            const h = now.getHours();
            const total = h * 60 + now.getMinutes();
            const day = now.getDate();
            const weekday = now.getDay();

            // ============= 和getStatusTag用同一套7天周期判断 =============
            const BASE_DATE = new Date(2026, 0, 1);
            const diffDays = Math.floor((now.getTime() - BASE_DATE.getTime()) / (1000 * 60 * 60 * 24));
            const mod7 = ((diffDays % 7) + 7) % 7;
            const isTXDBigNight = (mod7 === 0) && (personaId === 'tianxiaoduo');

            if (personaId === 'tianxiaoduo') {
                // 大夜班日：8-20点补觉（睡觉→触发默认回复）；20-次日8点在线不触发
                if (isTXDBigNight) return total >= 8 * 60 && total < 20 * 60;

                const isSunday = weekday === 0;
                if (isSunday) return total >= 23 * 60 || total < 8 * 60;
                // 非大夜班+非周日：22:30~次日6:00 睡觉
                return total >= 22 * 60 + 30 || total < 6 * 60;
            }
            if (personaId === 'baijie') {
                const isFirstHalf = day <= 15;
                const isSunday = weekday === 0;
                // 周日：3-9点才睡觉，0-3点醒（红酒/SPA熬夜）不触发
                if (isSunday) return total >= 3 * 60 && total < 9 * 60;
                // 上半月夜班：5-11点补觉；0-5点工作（在线）
                if (isFirstHalf) return total >= 5 * 60 && total < 11 * 60;
                // 下半月白班：3-9点睡觉；0-3点夜生活（在线）
                return total >= 3 * 60 && total < 9 * 60;
            }
            if (personaId === 'xiaoya') {
                const isTue = weekday === 2;
                const isFri = weekday === 5;
                const isWed = weekday === 3;
                const isSat = weekday === 6;
                const isRest = isWed || isSat;
                const isSing = isTue || isFri;
                // 休息日（三/六）：3-8点睡觉；0-3点熬夜画画
                if (isRest) return total >= 3 * 60 && total < 8 * 60;
                // 驻唱日（二/五）：5-12点补觉；0-5点驻唱收尾
                if (isSing) return total >= 5 * 60 && total < 12 * 60;
                // 普通工作日（一/四/日）：22-次日7点睡觉
                return total >= 22 * 60 || total < 7 * 60;
            }
            return false;
        }

        async function exportChat() {
            const history = getHistory();
            if (history.length === 0) {
                showAlert('导出失败', '当前角色没有聊天记录可导出', '📭');
                return;
            }
            const data = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                persona: currentPersona.name,
                personaId: currentPersona.id,
                messages: history
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Girls3@${getDateStr()}_${currentPersona.name}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert('导出成功', `已导出 ${currentPersona.name} 的 ${history.length} 条聊天记录`, '📤');
        }

        async function importChat() {
            const file = await showImportModal();
            if (!file) return;
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                if (!data.messages || !Array.isArray(data.messages)) throw new Error('无效格式');
                const imported = data.messages;
                const current = getHistory();
                const all = [...current, ...imported];
                const seen = new Set();
                const merged = [];
                for (const msg of all) {
                    const key = msg.timestamp || msg.time || JSON.stringify(msg);
                    if (!seen.has(key)) { seen.add(key);
                        merged.push(msg); }
                }
                merged.sort((a, b) => (a.timestamp || a.time || '').localeCompare(b.timestamp || b.time || ''));
                saveHistory(merged);
                renderMessages();
                showAlert('导入成功', `共导入 ${imported.length} 条消息，当前总计 ${merged.length} 条`, '✅');
            } catch (e) {
                showAlert('导入失败', '文件格式不正确，请选择 .json 文件', '❌');
            }
        }

            const name = currentPersona.name;

            ];
            for (const step of steps) {

            showAlert('已清空', `已清空与「${name}」的所有聊天记录`, '🗑️');
        }
