<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 女友</title>
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            color: #edf2f7;
        }

        .app {
            max-width: 480px;
            width: 100%;
            height: 94vh;
            max-height: 780px;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #141a24;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2b3a50;
            border-radius: 8px;
        }

        /* ===== 头部 ===== */
        .header {
            padding: 14px 16px 10px 16px;
            border-bottom: 1px solid #2a3344;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: #0f161e;
            flex-wrap: wrap;
        }

        .header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #2b5ca8;
        }

        .header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header .info {
            flex: 1;
            min-width: 80px;
        }

        .header .info .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .info .name-row h1 {
            font-size: 17px;
            font-weight: 600;
            color: #edf2f7;
        }

        .header .info .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #7a8aa3;
            flex-wrap: wrap;
        }

        .header .info .status-row .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 2px;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .header .info .status-row .status-tag {
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid #2a3344;
            background: #1a2538;
            color: #8899bb;
            white-space: nowrap;
        }

        .status-tag.working {
            color: #4fc3f7;
            border-color: #2b5ca8;
        }

        .status-tag.resting {
            color: #ffb74d;
            border-color: #8d6e3f;
        }

        .status-tag.sleeping {
            color: #7986cb;
            border-color: #3949ab;
        }

        .status-tag.free {
            color: #81c784;
            border-color: #388e3c;
        }

        .status-tag.singing {
            color: #ff8a65;
            border-color: #d84315;
        }

        /* ===== 三点菜单 ===== */
        .menu-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #7a8aa3;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            line-height: 1;
            transition: 0.2s;
            letter-spacing: 2px;
        }

        .menu-btn:hover {
            background: #1e283a;
            color: #edf2f7;
        }

        .menu-dropdown {
            position: absolute;
            right: 0;
            top: 36px;
            background: #1a2538;
            border: 1px solid #2a3344;
            border-radius: 12px;
            padding: 6px 0;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 100;
            overflow: hidden;
        }

        .menu-dropdown.open {
            display: block;
        }

        .menu-dropdown .item {
            padding: 10px 16px;
            font-size: 13px;
            color: #a0b3cc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .menu-dropdown .item:hover {
            background: #2a3344;
            color: #edf2f7;
        }

        .menu-dropdown .item.danger {
            color: #cf6679;
        }

        .menu-dropdown .item.danger:hover {
            background: #2a1418;
            color: #ff8a9e;
        }

        .menu-dropdown .divider {
            height: 1px;
            background: #2a3344;
            margin: 4px 12px;
        }

        /* ===== 角色切换栏 ===== */
        .persona-bar {
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
            background: #0c131c;
            border-bottom: 1px solid #1a2330;
        }

        .persona-bar::-webkit-scrollbar {
            display: none;
        }

        .persona-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 70px;
            border: 2px solid transparent;
            background: transparent;
        }

        .persona-item.active {
            border-color: #2b5ca8;
            background: #1a2538;
        }

        .persona-item .pavatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2f3b4e;
        }

        .persona-item.active .pavatar {
            border-color: #3a7bd5;
        }

        .persona-item .pname {
            font-size: 12px;
            color: #edf2f7;
            white-space: nowrap;
        }

        .persona-item.active .pname {
            color: #edf2f7;
            font-weight: 600;
        }

        /* ===== API Row ===== */
        .api-row {
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
            background: #0c131c;
            border-bottom: 1px solid #1a2330;
        }

        .api-row label {
            font-size: 12px;
            color: #5b6e8a;
        }

        .api-row input {
            flex: 1;
            min-width: 100px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #2f3b4e;
            background: #1a2533;
            color: #edf2f7;
            font-size: 13px;
            font-family: inherit;
        }

        .api-row input:focus {
            outline: none;
            border-color: #3a7bd5;
        }

        .api-row input::placeholder {
            color: #4d627c;
        }

        .api-row .status {
            font-size: 11px;
            color: #4d627c;
        }

        .api-row .status.ready {
            color: #4caf50;
        }

        /* ===== 消息区 ===== */
        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #10171f;
            min-height: 0;
        }

        /* ===== 消息气泡 ===== */
        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.25s ease-out;
            word-break: break-word;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            align-self: flex-start;
            background: #1e283a;
            color: #e2e8f0;
            border-bottom-left-radius: 6px;
            border: 1px solid #2b354a;
        }

        .message.user {
            align-self: flex-end;
            background: #2b5ca8;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
        }

        .message.sys {
            font-size: 12px;
            color: #5b6e8a;
            text-align: center;
            align-self: center;
            background: transparent !important;
            border: none !important;
            padding: 4px 0 !important;
        }

        .message.bot .msg-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            display: block;
            margin-top: 4px;
            border: 1px solid #2b354a;
        }

        /* ===== 音频 ===== */
        .audio-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            max-width: 220px;
            padding: 2px 0;
            cursor: pointer;
            user-select: none;
        }

        .audio-play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #3a7bd5;
            color: white;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            padding: 0;
            line-height: 1;
        }

        .audio-play-btn:hover {
            background: #4f8ee8;
        }

        .audio-play-btn.playing {
            background: #e85a4f;
        }

        .audio-wave {
            flex: 1;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 2px;
            min-width: 60px;
            position: relative;
        }

        .audio-wave .bar {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #3a4a5e;
            transition: height 0.15s, background 0.3s;
            min-height: 3px;
            max-height: 22px;
        }

        .audio-wave .bar.active {
            background: #3a7bd5;
        }

        .audio-wave .bar.played {
            background: #3a7bd5;
            opacity: 0.6;
        }

        .audio-duration {
            font-size: 12px;
            color: #8899bb;
            flex-shrink: 0;
            min-width: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
        }

        /* ===== 输入区 ===== */
        .input-area {
            padding: 8px 16px 14px 16px;
            border-top: 1px solid #1f2a38;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: flex-end;
            background: #0f161e;
        }

        .input-area textarea {
            flex: 1;
            background: #1a2533;
            border: 1px solid #2f3b4e;
            border-radius: 24px;
            padding: 10px 16px;
            font-size: 15px;
            color: #edf2f7;
            resize: none;
            height: 48px;
            max-height: 100px;
            font-family: inherit;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #3a7bd5;
        }

        .input-area textarea::placeholder {
            color: #4d627c;
        }

        .input-area textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-area button {
            background: #2b5ca8;
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-area button:hover:not(:disabled) {
            background: #3a7bd5;
        }

        .input-area button:active:not(:disabled) {
            transform: scale(0.92);
        }

        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 遮罩 ===== */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            border-radius: 32px;
            backdrop-filter: blur(2px);
        }

        .overlay.open {
            display: flex;
        }

        /* ===== 通用弹窗 ===== */
        .modal {
            background: #1a2538;
            border: 1px solid #2a3344;
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .modal .modal-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: block;
        }

        .modal h2 {
            font-size: 18px;
            font-weight: 600;
            color: #edf2f7;
            margin-bottom: 6px;
        }

        .modal p {
            font-size: 14px;
            color: #a0b3cc;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .modal .file-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #10171f;
            border: 1px solid #2a3344;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 12px;
            text-align: left;
        }

        .modal .file-input-row label {
            background: #2b5ca8;
            color: white;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .modal .file-input-row label:hover {
            background: #3a7bd5;
        }

        .modal .file-input-row input[type="file"] {
            display: none;
        }

        .modal .file-input-row .file-name {
            font-size: 13px;
            color: #8899bb;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }

        .modal .modal-actions button {
            padding: 8px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-weight: 500;
        }

        .modal .modal-actions .btn-cancel {
            background: #2f3b4e;
            color: #a0b3cc;
        }

        .modal .modal-actions .btn-cancel:hover {
            background: #3a4a62;
            color: #edf2f7;
        }

        .modal .modal-actions .btn-confirm {
            background: #3a7bd5;
            color: white;
        }

        .modal .modal-actions .btn-confirm:hover {
            background: #4f8ee8;
        }

        .modal .modal-actions .btn-danger {
            background: #cf6679;
            color: white;
        }

        .modal .modal-actions .btn-danger:hover {
            background: #e5738a;
        }

        .modal .pwd-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #2a3344;
            border-radius: 10px;
            background: #10171f;
            color: #edf2f7;
            font-size: 16px;
            font-family: inherit;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 4px;
        }

        .modal .pwd-input:focus {
            outline: none;
            border-color: #3a7bd5;
        }

        .modal .pwd-input::placeholder {
            color: #4d627c;
            letter-spacing: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }

            .overlay {
                border-radius: 0;
            }

            .modal {
                max-width: 92%;
                padding: 24px 18px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="app" id="app">
        <!-- ===== 遮罩 + 弹窗容器 ===== -->
        <div class="overlay" id="overlay">
            <div class="modal" id="modalContent">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="avatar" id="headerAvatar">
                <img id="headerAvatarImg" src="/img/tianxiaoduo/avatar/avatar.jpg" alt="avatar">
            </div>
            <div class="info">
                <div class="name-row">
                    <h1 id="headerName">甜小朵</h1>
                </div>
                <div class="status-row">
                    <span class="dot"></span>
                    <span>在线</span>
                    <span class="status-tag" id="statusTag">💉 上班中</span>
                </div>
            </div>
            <div class="menu-wrapper">
                <button class="menu-btn" id="menuBtn" aria-label="菜单">···</button>
                <div class="menu-dropdown" id="menuDropdown">
                    <button class="item" data-action="import">📥 导入聊天记录</button>
                    <button class="item" data-action="export">📤 导出聊天记录</button>
                    <div class="divider"></div>
                    <button class="item" data-action="show">📖 Girls3</button>
                    <button class="item" data-action="world">🗺️ 世界观</button>
                    <div class="divider"></div>
                    <button class="item danger" data-action="clear">🗑️ 清空所有消息</button>
                </div>
            </div>
        </div>

        <!-- ===== 角色切换栏 ===== -->
        <div class="persona-bar" id="personaBar"></div>

        <!-- ===== API Key ===== -->
        <div class="api-row">
            <label>🔑</label>
            <input type="password" id="apiKeyInput" placeholder="DeepSeek API Key">
            <span class="status" id="apiStatus">未配置</span>
        </div>

        <!-- ===== 消息区 ===== -->
        <div class="message-area" id="messageArea"></div>

        <!-- ===== 输入区 ===== -->
        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="输入消息…" disabled></textarea>
            <button id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  配置
        // ============================================================
        const DEFAULT_CONFIG = {
            mediaProb: 0.8,
            nakedProb: 0.3,
            maxHistory: 60,
            maxFileNum: 30,
            maxNakedNum: 15,
            maxAudioNum: 30,
            cityName: '舒心市',
            petTianxiaoduo: '宝贝',
            petBaijie: '亲爱的',
            petXiaoya: '你',
            configPassword: 'wlaoshi520'
        };

        function loadConfig() {
            const raw = localStorage.getItem('ai_girls_config');
            if (raw) {
                try {
                    const saved = JSON.parse(raw);
                    return { ...DEFAULT_CONFIG, ...saved };
                } catch (e) { }
            }
            return { ...DEFAULT_CONFIG };
        }

        const CONFIG = loadConfig();

        // ============================================================
        //  常量
        // ============================================================
        const MEDIA_PROBABILITY = CONFIG.mediaProb;
        const NAKED_PROBABILITY = CONFIG.nakedProb;
        const MAX_HISTORY = CONFIG.maxHistory;
        const MAX_FILE_NUM = CONFIG.maxFileNum;
        const MAX_NAKED_NUM = CONFIG.maxNakedNum;
        const MAX_AUDIO_NUM = CONFIG.maxAudioNum;
        const CONFIG_PASSWORD = CONFIG.configPassword;
        const CITY_NAME = CONFIG.cityName || '舒心市';

        // ============================================================
        //  二十四节气表
        // ============================================================
        const SOLAR_TERMS = {
            '01-05': '小寒',
            '01-20': '大寒',
            '02-04': '立春',
            '02-19': '雨水',
            '03-05': '惊蛰',
            '03-20': '春分',
            '04-04': '清明',
            '04-20': '谷雨',
            '05-05': '立夏',
            '05-21': '小满',
            '06-05': '芒种',
            '06-21': '夏至',
            '07-07': '小暑',
            '07-22': '大暑',
            '08-07': '立秋',
            '08-23': '处暑',
            '09-07': '白露',
            '09-23': '秋分',
            '10-08': '寒露',
            '10-23': '霜降',
            '11-07': '立冬',
            '11-22': '小雪',
            '12-07': '大雪',
            '12-21': '冬至'
        };

        // ============================================================
        //  数据加载（从 data.json）
        // ============================================================
        let PERSONAS = [];
        let CITY_DATA = null;
        let appReady = false;

        async function loadData() {
            try {
                const resp = await fetch('data.json');
                const data = await resp.json();
                CITY_DATA = data;
                PERSONAS = data.personas;
                return data;
            } catch (e) {
                console.error('加载 data.json 失败:', e);
                return null;
            }
        }

        // ============================================================
        //  位置查询功能
        // ============================================================
        const LOCATION_KEYWORDS = ['在哪', '在哪里', '位置', '地址', '怎么走', '在哪儿', '附近'];

        function isLocationQuery(text) {
            return LOCATION_KEYWORDS.some(kw => text.includes(kw));
        }

        function findLocation(text, landmarks, personas) {
            // 先在地标中查找
            for (const item of landmarks) {
                if (text.includes(item.name)) {
                    return {
                        found: true,
                        name: item.name,
                        type: '地标',
                        district: item.district,
                        address: item.address,
                        full: `${item.name}位于${item.district}${item.address}`
                    };
                }
            }
            // 再在角色中查找（工作地点和家庭住址）
            for (const p of personas) {
                if (text.includes(p.name)) {
                    return {
                        found: true,
                        name: p.name,
                        type: '角色',
                        district: p.district,
                        address: p.address,
                        workAddr: p.workAddr,
                        work: p.workplace,
                        full: `${p.name}住在${p.district}${p.address}，在${p.district}${p.workAddr}的${p.work}工作`
                    };
                }
                if (text.includes(p.workplace)) {
                    return {
                        found: true,
                        name: p.workplace,
                        type: '工作地点',
                        district: p.district,

        function calculateAge(birthday) {
            const today = new Date();
            const birth = new Date(birthday);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
                age--;
            }
            return age;
        }

        async function exportChat() {
            const history = getHistory();
            if (history.length === 0) {
                showAlert('导出失败', '当前角色没有聊天记录可导出', '📭');
                return;
            }
            const data = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                persona: currentPersona.name,
                personaId: currentPersona.id,
                messages: history
            };
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Girls3@${getDateStr()}_${currentPersona.name}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert('导出成功', `已导出 ${currentPersona.name} 的 ${history.length} 条聊天记录`, '📤');
        }

        async function importChat() {
            const file = await showImportModal();
            if (!file) return;
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                if (!data.messages || !Array.isArray(data.messages)) throw new Error('无效格式');
                const imported = data.messages;
                const current = getHistory();
                const all = [...current, ...imported];
                const seen = new Set();
                const merged = [];
                for (const msg of all) {
                    const key = msg.timestamp || msg.time || JSON.stringify(msg);
                    if (!seen.has(key)) {
                        seen.add(key);
                        merged.push(msg);
                    }
                }
                merged.sort((a, b) => (a.timestamp || a.time || '').localeCompare(b.timestamp || b.time || ''));
                saveHistory(merged);
                renderMessages();
                showAlert('导入成功', `共导入 ${imported.length} 条消息，当前总计 ${merged.length} 条`, '✅');
            } catch (e) {
                showAlert('导入失败', '文件格式不正确，请选择 .json 文件', '❌');
            }
        }

            '降温', '升温', '凉快'
        ];

        async function fetchWeather() {
            const now = Date.now();
            if (weatherCache.data && (now - weatherCache.time) < WEATHER_CACHE_DURATION) {
                return weatherCache.data;
            }
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const city = encodeURIComponent(CITY_NAME);
                const resp = await fetch(`https://wttr.in/${city}?format=%C+%t`, { signal: controller.signal });
                clearTimeout(timeout);
                if (!resp.ok) throw new Error('API失败');
                const text = await resp.text();
                const match = text.match(/(.+?)\s+([+-]?\d+°C)/);
                if (match) {
                    weatherCache.data = { condition: match[1].trim(), temperature: match[2] };
                } else {
                    weatherCache.data = { condition: text.trim(), temperature: '?' };
                }
                weatherCache.time = now;
                return weatherCache.data;
            } catch (e) {
                console.warn('天气获取失败:', e);
                const fallbacks = [
                    '天气预报明明说有雨但现在风和日丽',
                    '天气软件说下雨，但我看窗外太阳挺好的',
                    '明明报的是多云，结果出大太阳了',
                    '说好的降温呢？我感觉今天还是好热'
                ];
                return { fallback: fallbacks[Math.floor(Math.random() * fallbacks.length)] };
            }
        }

        function isWeatherQuery(text) {
            return WEATHER_KEYWORDS.some(kw => text.includes(kw));
        }

                const now = new Date();
                const day = now.getDate();
                if (day <= 15) return '夜班（晚上8点到次日凌晨4点），工作轻松可聊天';
                return '白班（上午10点到下午6点），工作轻松可聊天';
            }

            if (personaId === 'xiaoya') {
                if (dayName === '周三' || dayName === '周六') return '休息日，不上班';
                if (dayName === '周二' || dayName === '周五') return '上班，晚上去寻觅小酒吧驻唱';
                return '上班';
            }

            return '上班';
        }

        // 获取今天、明天、后天的日期信息
        function getDateInfo() {
            const now = new Date();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const today = new Date(now);
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const dayAfter = new Date(now);
            dayAfter.setDate(dayAfter.getDate() + 2);

            return {
                today: { date: today.getDate(), weekday: weekdays[today.getDay()], month: today.getMonth() + 1 },
                tomorrow: { date: tomorrow.getDate(), weekday: weekdays[tomorrow.getDay()], month: tomorrow.getMonth() + 1 },
                dayAfter: { date: dayAfter.getDate(), weekday: weekdays[dayAfter.getDay()], month: dayAfter.getMonth() + 1 }
            };
        }

        // ============================================================
        //  System Prompt（自动替换年龄 + 注入日期日程 + 位置数据）
        // ============================================================
        function buildSystemPrompt(persona, userMessage, weather) {
            const timeInfo = getTimeInfo();
            const status = getStatusTag(timeInfo.now, persona.id);
            const age = calculateAge(persona.birthday);

            // 替换人设中的年龄
            let prompt = persona.systemPrompt.replace(/今年\d+岁/, `今年${age}岁`);

            // ===== 注入日期和日程信息 =====
            const dateInfo = getDateInfo();
            const todaySchedule = getSchedule(persona.id, dateInfo.today.weekday);
            const tomorrowSchedule = getSchedule(persona.id, dateInfo.tomorrow.weekday);
            const dayAfterSchedule = getSchedule(persona.id, dateInfo.dayAfter.weekday);

            prompt += `\n\n📅 日期信息：`;
            prompt += `\n今天（${dateInfo.today.month}月${dateInfo.today.date}日 ${dateInfo.today.weekday}）：${todaySchedule}`;
            prompt += `\n明天（${dateInfo.tomorrow.month}月${dateInfo.tomorrow.date}日 ${dateInfo.tomorrow.weekday}）：${tomorrowSchedule}`;
            prompt += `\n后天（${dateInfo.dayAfter.month}月${dateInfo.dayAfter.date}日 ${dateInfo.dayAfter.weekday}）：${dayAfterSchedule}`;
            prompt += `\n当用户问到「明天」「后天」「几号」「星期几」时，请根据上面提供的日期信息准确回答。`;

            prompt +=
                `\n\n当前时间：${timeInfo.year}年${timeInfo.month}月${timeInfo.day}日 ${timeInfo.weekday} ${String(timeInfo.hour).padStart(2, '0')}:${String(timeInfo.minute).padStart(2, '0')}`;
            prompt += `\n当前季节：${timeInfo.season}天`;
            if (timeInfo.term) prompt += `\n今日节气：${timeInfo.term}`;
            if (timeInfo.holiday) prompt += `\n今日节日：${timeInfo.holiday}`;

            prompt += `\n\n${persona.name}当前状态：${status.icon} ${status.label}`;

            prompt += `\n城市：${CITY_NAME}`;

            if (weather) {
                if (weather.fallback) {
                    prompt += `\n天气：${weather.fallback}`;
                } else {
                    prompt += `\n当前天气：${weather.condition}，${weather.temperature}`;
                }
            }

            const moods = {
                'working': '专注认真',
                'resting': '放松慵懒',
                'sleeping': '困倦温柔',
                'free': '轻松愉快',
                'singing': '兴奋投入'
            };
            prompt += `\n当前情绪：${moods[status.cls] || '平静'}`;

            prompt += `\n\n用户是你的男朋友。用户同时有三个女朋友：甜小朵、白洁、小雅。你们三人互相认识，知道彼此的存在。`;

            const petNames = {
                'tianxiaoduo': CONFIG.petTianxiaoduo || '宝贝',
                'baijie': CONFIG.petBaijie || '亲爱的',
                'xiaoya': CONFIG.petXiaoya || '你'
            };
            prompt += `\n你对用户的称呼是「${petNames[persona.id] || '亲爱的'}」。`;

            // ===== 注入位置数据（用于回答位置查询） =====
            if (CITY_DATA) {
                prompt += `\n\n📍 舒心市位置数据（用户问到位置时请据此回答）：`;
                // 地标
                for (const item of CITY_DATA.landmarks) {
                    prompt += `\n- ${item.name}：${item.district}${item.address}`;

                // 角色位置
                for (const p of CITY_DATA.personas) {

                prompt += `\n当用户问「在哪里」「在哪」「地址」「怎么走」时，请从上面的位置数据中查找并准确回答。`;

        // ============================================================
        //  音频 UI
        // ============================================================
        function createAudioUI(audioSrc, duration) {
            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            const btn = document.createElement('button');
            btn.className = 'audio-play-btn';
            btn.textContent = '▶';
            const wave = document.createElement('div');
            wave.className = 'audio-wave';
            const barCount = 20;
            const bars = [];
            for (let i = 0; i < barCount; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (4 + Math.random() * 18) + 'px';
                wave.appendChild(bar);
                bars.push(bar);
            }
            const durSpan = document.createElement('span');
            durSpan.className = 'audio-duration';
            const mins = Math.floor(duration / 60);
            const secs = duration % 60;
            durSpan.textContent = mins > 0 ? `${mins}'${String(secs).padStart(2, '0')}"` : `${secs}"`;
            wrapper.appendChild(btn);
            wrapper.appendChild(wave);
            wrapper.appendChild(durSpan);

            const audio = new Audio(audioSrc);
            audio.preload = 'metadata';
            let isPlaying = false;
            let progressInterval = null;

            function updateProgress() {
                if (!audio.duration) return;
                const progress = audio.currentTime / audio.duration;
                const activeCount = Math.floor(progress * barCount);
                bars.forEach((bar, idx) => {
                    bar.className = 'bar';
                    if (idx < activeCount) bar.classList.add('played');
                    if (idx === activeCount && idx < barCount - 1) bar.classList.add('active');
                });
                const curMin = Math.floor(audio.currentTime / 60);
                const curSec = Math.floor(audio.currentTime % 60);
                const totalMin = Math.floor(duration / 60);
                const totalSec = duration % 60;
                durSpan.textContent =
                    `${curMin > 0 ? curMin + "'" + String(curSec).padStart(2, '0') : curSec} / ${totalMin > 0 ? totalMin + "'" + String(totalSec).padStart(2, '0') : totalSec}`;
            }

            function resetWave() {
                bars.forEach(bar => {
                    bar.className = 'bar';
                    bar.style.height = (4 + Math.random() * 18) + 'px';
                });
                durSpan.textContent = mins > 0 ? `${mins}'${String(secs).padStart(2, '0')}"` : `${secs}"`;
            }

            function togglePlay() {
                if (isPlaying) {
                    audio.pause();
                } else {
                    if (currentAudioElement && currentAudioElement !== audio) {
                        currentAudioElement.pause();
                        if (currentAudioWrapper) {
                            const oldBtn = currentAudioWrapper.querySelector('.audio-play-btn');
                            if (oldBtn) {
                                oldBtn.textContent = '▶';
                                oldBtn.classList.remove('playing');
                            }
                            const oldWave = currentAudioWrapper.querySelector('.audio-wave');
                            if (oldWave) {
                                oldWave.querySelectorAll('.bar').forEach(bar => {
                                    bar.className = 'bar';
                                    bar.style.height = (4 + Math.random() * 18) + 'px';
                                });
                            }
                            const oldDur = currentAudioWrapper.querySelector('.audio-duration');
                            if (oldDur) {
                                oldDur.textContent = mins > 0 ? `${mins}'${String(secs).padStart(2, '0')}"` : `${secs}"`;
                            }
                        }
                    }
                    audio.play();
                }
            }

            audio.addEventListener('play', () => {
                isPlaying = true;
                btn.textContent = '⏸';
                btn.classList.add('playing');
                currentAudioElement = audio;
                currentAudioWrapper = wrapper;
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 100);
            });

            audio.addEventListener('pause', () => {
                isPlaying = false;
                btn.textContent = '▶';
                btn.classList.remove('playing');
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            });

            audio.addEventListener('ended', () => {
                isPlaying = false;
                btn.textContent = '▶';
                btn.classList.remove('playing');
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
                resetWave();
                audio.currentTime = 0;
                if (currentAudioElement === audio) {
                    currentAudioElement = null;
                    currentAudioWrapper = null;
                }
            });

            audio.addEventListener('error', () => {
                btn.textContent = '⚠';
                btn.style.background = '#888';
                durSpan.textContent = '加载失败';
            });

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay();
            });
            wave.addEventListener('click', (e) => {
                if (!audio.duration) return;
                const rect = wave.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                audio.currentTime = x * audio.duration;
                updateProgress();
            });

            audio.addEventListener('loadedmetadata', () => {
                const realDur = Math.floor(audio.duration);
                if (realDur > 0) {
                    const m = Math.floor(realDur / 60);
                    const s = realDur % 60;
                    durSpan.textContent = m > 0 ? `${m}'${String(s).padStart(2, '0')}"` : `${s}"`;
                }
            });

            return wrapper;
        }

        // ============================================================
        //  关键词触发
        // ============================================================
        function containsKeyword(text, keywords) {
            return keywords.some(kw => text.includes(kw));
        }

        const AUDIO_KEYWORDS = [
            '声音', '说话', '语音', '哼两句', '说句话'
        ];

        const IMAGE_KEYWORDS = [
            '照片', '自拍', '看看你', '美照', '发张照片',
            '我想看看你', '露脸', '瞅瞅', '穿什么', '来一张'
        ];

        const NAKED_KEYWORDS = [
            '加减乘除'
        ];

        const ALL_IMAGE_KEYWORDS = [...IMAGE_KEYWORDS, ...NAKED_KEYWORDS];
        const COMBO_KEYWORDS = ['想你了', '晚安', '早安', '抱抱', '亲亲'];
        const COMBO_REPLIES = {
            '想你了': '我也想你呀～',
            '晚安': '晚安，好梦～',
            '早安': '早安呀～',
            '抱抱': '抱抱～',
            '亲亲': 'mua～'
        };

        function handleKeywordTrigger(userText) {
            const matchedCombo = COMBO_KEYWORDS.find(kw => userText.includes(kw));
            const isAudio = containsKeyword(userText, AUDIO_KEYWORDS);
            const isImage = containsKeyword(userText, ALL_IMAGE_KEYWORDS);
            const isNaked = containsKeyword(userText, NAKED_KEYWORDS);

            let shouldMedia;
            if (isNaked) {
                shouldMedia = Math.random() < NAKED_PROBABILITY;
            } else {
                shouldMedia = Math.random() < MEDIA_PROBABILITY;
            }

            if (!shouldMedia) {
                return null;
            }

            if (matchedCombo) {
                return {
                    type: 'combo',
                    text: COMBO_REPLIES[matchedCombo] || '',
                    image: getRandomImagePath(isNaked),
                    audio: getRandomAudioPath()
                };
            }

            if (isAudio && isImage) {
                return {
                    type: 'combo',
                    text: '',
                    image: getRandomImagePath(isNaked),
                    audio: getRandomAudioPath()
                };
            }

            if (isAudio) {
                return { type: 'audio', path: getRandomAudioPath() };
            }

            if (isImage) {
                return { type: 'image', path: getRandomImagePath(isNaked) };
            }

            return null;
        }

        // ============================================================
        //  用户生日
        // ============================================================
        const LUNAR_BIRTHDAYS = {
            2024: '11-26',
            2025: '12-15',
            2026: '12-05',
            2027: '11-24',
            2028: '12-12',
            2029: '12-01',
            2030: '11-20'
        };

        function getUserBirthday() {
            const year = new Date().getFullYear();
            return LUNAR_BIRTHDAYS[year] || '12-05';
        }

        // ============================================================
        //  每周总结
        // ============================================================
        function checkWeekSummary(now, userMessage) {
            const weekday = now.getDay();
            const hour = now.getHours();
            if (weekday !== 0 || hour < 20) return null;

            const key = 'week_summary_' + currentPersona.id + '_' + getDateStr();
            if (localStorage.getItem(key)) return null;

            const history = getHistory();
            if (history.length < 2) return null;

            localStorage.setItem(key, 'true');
            return `（这周我们聊了好多呢～感觉你${Math.random() > 0.5 ? '工作有点忙' : '心情还不错'}，下周也要加油哦💪）`;
        }

        // ============================================================
        //  位置查询处理
        // ============================================================
        function handleLocationQueryText(userText) {
            if (!isLocationQuery(userText)) return null;
            if (!CITY_DATA) return null;

            const result = findLocation(userText, CITY_DATA.landmarks, CITY_DATA.personas);
            if (!result.found) return null;
            return result.full;
        }

        // ============================================================
        //  API 调用
        // ============================================================
        async function callDeepSeek(userMessage) {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showSystemMessage('⚠️ 请先配置 DeepSeek API Key');
                return;
            }

            const now = new Date();
            if (shouldDefaultReply(currentPersona.id, now)) {
                const reply = getDefaultReply(currentPersona.id);
                addMessage(reply, 'bot');
                return;
            }

            const summary = checkWeekSummary(now, userMessage);
            if (summary) {
                addMessage(summary, 'bot');
            }

            let weather = null;
            if (isWeatherQuery(userMessage)) {
                weather = await fetchWeather();
            }

            const systemPrompt = buildSystemPrompt(currentPersona, userMessage, weather);
            const history = getHistory();
            const context = history.slice(-MAX_HISTORY);

            const messages = [
                { role: 'system', content: systemPrompt },
                ...context.map(h => ({ role: h.role, content: h.content }))
            ];

            isWaiting = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: messages,
                        temperature: 0.9,
                        max_tokens: 400
                    })
                });
                const data = await resp.json();
                if (data.error) throw new Error(data.error.message || 'API 调用失败');
                const reply = data.choices[0].message.content;
                addMessage(reply, 'bot');
            } catch (e) {
                showSystemMessage('❌ 请求失败：' + e.message);
            } finally {
                removeTyping();
                isWaiting = false;
                sendBtn.disabled = false;
            }
        }

        // ============================================================
        //  发送入口
        // ============================================================
        function handleSend() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showSystemMessage('⚠️ 请先配置 API Key');
                return;
            }
            const text = userInput.value.trim();
            if (!text || isWaiting || !currentPersona) return;

            // ★★★ 位置查询优先处理 ★★★
            const locationResult = handleLocationQueryText(text);
            if (locationResult) {
                addMessage(text, 'user');
                userInput.value = '';
                userInput.style.height = '48px';
                addMessage(locationResult, 'bot');
                return;
            }

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = '48px';

            const mediaResult = handleKeywordTrigger(text);
            if (mediaResult) {
                if (mediaResult.type === 'combo') {
                    addComboMessage(mediaResult.text, mediaResult.image, mediaResult.audio);
                } else if (mediaResult.type === 'image') {
                    addMediaMessage('image', mediaResult.path);
                } else if (mediaResult.type === 'audio') {
                    addMediaMessage('audio', mediaResult.path);
                }
                return;
            }

            callDeepSeek(text);
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        sendBtn.onclick = handleSend;
        userInput.onkeydown = e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        };
        userInput.oninput = function () {
            this.style.height = '48px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        };

        apiKeyInput.onchange = function () {
            const val = this.value.trim();
            if (val) {
                localStorage.setItem('ai_api_key', val);
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'status ready';
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                localStorage.removeItem('ai_api_key');
                apiStatus.textContent = '❌ 未配置';
                apiStatus.className = 'status';
                userInput.disabled = true;
                sendBtn.disabled = true;
            }
        };

        // ============================================================
        //  初始化
        // ============================================================
        async function init() {
            await loadData();

            if (!PERSONAS || PERSONAS.length === 0) {
                console.error('加载人物数据失败');
                return;
            }

            // 初始化 conversations
            PERSONAS.forEach(p => {
                const key = 'chat_' + p.id;
                const saved = JSON.parse(localStorage.getItem(key) || '[]');
                const fixed = saved.map(msg => {
                    if (msg.role === 'bot') msg.role = 'assistant';
                    return msg;
                });
                conversations[p.id] = fixed.slice(-MAX_HISTORY);
            });

            currentPersona = PERSONAS[0];

            if (apiKey) {
                apiKeyInput.value = apiKey;
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'status ready';
                userInput.disabled = false;
                sendBtn.disabled = false;
            }

            renderPersonas();
            updateHeader();
            renderMessages();

            setInterval(() => updateStatusTag(), 60000);

            console.log('💕 AI女友已启动');
            console.log('📊 当前角色:', currentPersona.name);
            console.log('📝 记忆条数:', MAX_HISTORY);
            console.log('🎯 普通触发概率:', MEDIA_PROBABILITY * 100 + '%');
            console.log('🎯 Naked触发概率:', NAKED_PROBABILITY * 100 + '%');
            console.log('🔐 配置密码已设置');
            console.log('📱 点击右上角 ··· → 配置管理');
            console.log('📍 位置查询已启用');
            console.log('🏷️ 关键词:', LOCATION_KEYWORDS.join(', '));
        }

        // 启动
        init();
    </script>

</body>

</html>
